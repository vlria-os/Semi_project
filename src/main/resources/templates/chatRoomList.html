<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>chatRoomList.html</title>
    <link rel="stylesheet" th:href="@{/css/chat.css}">
</head>
<body>
<div class="chat-page">
    <div class="chat-card">
        <div class="chat-header">
            <div class="title">
                <span class="badge-dot"></span>
                <span>채팅</span>
            </div>
            <div class="header-actions">
            <!-- ✅ 버튼+메뉴 래퍼 (기준점) -->
            <div class="menu-wrap">
                <button class="btn btn-primary" type="button" onclick="toggleMenu(event)">새 채팅</button>

                <!-- ✅ 버튼 바로 아래 뜨는 드롭다운 -->
                <div id="chatMenu" class="menu-dropdown" style="display:none;">
                    <a class="menu-item" th:href="@{/chat/new}">1:1 채팅</a>
                    <a class="menu-item" th:href="@{/chat/group/new}">단체 채팅</a>
                </div>
            </div>
        </div>
        </div>

        <div class="list-wrap">
            <table class="room-list" id="chatTable">
                <tr th:each="room:${list}"
                    class="room-row"
                    th:attr="data-room-id=${room.room_id}">
                    <td class="room-cell">
                        <div class="room-main">
                            <div class="avatar"
                                 th:text="
                                 ${room != null and room.room_name != null and #strings.length(room.room_name) > 0 ? #strings.substring(room.room_name,0,1) : 'C'}
                                 ">C</div>


                            <div class="room-text">
                                <div class="room-name-line">
                                    <a class="room-name"
                                       href="#"
                                       th:attr="data-room-id=${room.room_id}"
                                       th:text="${room.room_name}"
                                       onclick="openChatWindow(this); return false;"></a>

                                    <span class="pill group-badge"
                                          th:attr="data-room-type=${room.roomType}"
                                          th:text="${room.user_count}"
                                          th:style="${room.roomType == 'group' and room.user_count >= 3}
                                            ? 'display:inline-flex;'
                                            : 'display:none;'"></span>
                                </div>

                                <div class="sub-line last-message"
                                     th:text="${room.last_message}">
                                </div>
                            </div>

                            <div style="min-width:72px; text-align:right;">
                                <div class="time last-time"
                                     th:text="${room != null and room.last_time != null ? #temporals.format(room.last_time, 'HH:mm') : ''}">
                                </div>
                                <span class="unread unread-count"
                                      th:text="${room != null ? (room.unread_count ?: 0) : 0}"
                                      th:style="${room != null and (room.unread_count ?: 0) > 0}
                                                    ? 'display:inline-flex;'
                                                    : 'display:none;'">
                                </span>

                            </div>
                        </div>
                    </td>
                </tr>
            </table>
        </div>

    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script th:inline="javascript">
    const userId = /*[[${user_id}]]*/ 0;

    const socket = new SockJS('/ws');
    const stompClient = Stomp.over(socket);

    stompClient.connect({}, function () {

        stompClient.subscribe("/topic/chat-list/" + userId, function(msg){
            const data = JSON.parse(msg.body);
            console.log("chat-list update:", data);

            if(data.action === "remove"){
                const row = document.querySelector(`[data-room-id="${data.roomId}"]`);
                if(row) row.remove();
                return;
            }

            const row = ensureRow(data); // 없으면 생성

            // 마지막 메시지
            const lastMsgEl = row.querySelector(".last-message");
            if(lastMsgEl) lastMsgEl.innerText = data.lastMessage ?? "";

            // 시간
            const timeEl = row.querySelector(".last-time");
            if(timeEl){
                timeEl.innerText = data.lastTime
                    ? new Date(data.lastTime).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
                    : "";
            }

            // unread
            const unreadEl = row.querySelector(".unread-count");
            if (unreadEl) {
                if ((data.unreadCount ?? 0) > 0) {
                    unreadEl.style.display = "inline-flex";
                    unreadEl.innerText = data.unreadCount;
                } else {
                    unreadEl.style.display = "none";
                }
            }

            // ✅ userCount (group badge)
            const badge = row.querySelector(".group-badge");
            if(badge){
                const cnt = Number(data.userCount ?? 0);
                if(data.roomType === "group" && cnt >= 3){
                    badge.style.display = "inline-flex";
                    badge.innerText = cnt;
                }else{
                    badge.style.display = "none";
                    badge.innerText = "";
                }
            }

            moveRowToTop(row);
        });


        stompClient.subscribe("/topic/chat-room-removed/" + userId, function(msg){
            const roomId = parseInt(msg.body);
            const row = document.querySelector(`[data-room-id="${roomId}"]`);
            if(row) row.remove();
        });

    });

    function moveRowToTop(row) {
        const table = document.getElementById("chatTable");
        table.prepend(row);
    }

    window.addEventListener("pageshow", function (event) {
        if (event.persisted) {
            location.reload();
        }
    });

    function toggleMenu(e) {
        if (e) e.stopPropagation();
        const menu = document.getElementById("chatMenu");
        menu.style.display = (menu.style.display === "none" || menu.style.display === "")
            ? "block" : "none";
    }

    // 바깥 클릭 시 닫기
    document.addEventListener("click", function () {
        const menu = document.getElementById("chatMenu");
        if (menu) menu.style.display = "none";
    });

    // 메뉴 클릭은 닫히지 않게
    document.getElementById("chatMenu")?.addEventListener("click", function(e){
        e.stopPropagation();
    });


    function openChatWindow(el){
        const roomId = el.getAttribute("data-room-id");
        const url = "/chat/room/" + roomId;

        // 같은 방이면 같은 창을 재사용(PC카톡 느낌)
        const windowName = "chat_room_" + roomId;

        // 창 옵션
        const features = "width=420,height=720,resizable=yes,scrollbars=yes";

        const w = window.open(url, windowName, features);

        // 팝업 차단 대비
        if(!w){
            alert("팝업 차단 중! 허용 후 다시 시도하세요.");
            return;
        }

        w.focus();
    }

    window.addEventListener("message", function (event) {
        if (event.origin !== window.location.origin) return;

        const data = event.data || {};
        if (data.type !== "CHAT_ROOM_LEFT") return;

        const roomId = data.roomId;

        // ✅ 목록에서 해당 방 즉시 제거
        const row = document.querySelector(`[data-room-id="${roomId}"]`);
        if (row) row.remove();
    });

    function ensureRow(data){
        let row = document.querySelector(`[data-room-id="${data.roomId}"]`);
        if(row) return row;

        const table = document.getElementById("chatTable");

        const tr = document.createElement("tr");
        tr.className = "room-row";
        tr.dataset.roomId = data.roomId;

        const firstChar = (data.roomName && data.roomName.length > 0) ? data.roomName.substring(0,1) : "C";

        tr.innerHTML = `
    <td class="room-cell">
      <div class="room-main">
        <div class="avatar">${firstChar}</div>

        <div class="room-text">
          <div class="room-name-line">
            <a class="room-name" href="#" data-room-id="${data.roomId}"
               onclick="openChatWindow(this); return false;">${data.roomName ?? "채팅방"}</a>
            <span class="pill group-badge" style="display:none;"></span>
          </div>
          <div class="sub-line last-message"></div>
        </div>

        <div style="min-width:72px; text-align:right;">
          <div class="time last-time"></div>
          <span class="unread unread-count" style="display:none;"></span>
        </div>
      </div>
    </td>
  `;

        table.prepend(tr);
        return tr;
    }

</script>
</body>
</html>
