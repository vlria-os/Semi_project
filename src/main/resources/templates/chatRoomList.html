<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>chatRoomList.html</title>
</head>
<body>
<h1>채팅 목록</h1>
<div id="chatMenuWrapper" style="position: relative;display: inline-block;"></div>
<button onclick="toggleMenu()">➕ 새 채팅</button>
<div id="chatMenu"
     style="display:none;
                position:absolute;
                background:#fff;
                border:1px solid #ccc;
                padding:5px;
                z-index:100;">
        <div>
            <a th:href="@{/chat/new}">1:1 채팅</a>
            <a th:href="@{/chat/group/new}">단체 채팅</a>
        </div>
</div>
</div>
<table id="chatTable">
    <tr th:each="room:${list}"
        th:attr="data-room-id=${room.room_id}">
        <td>
            <div class="room-title">
                <a href="#" th:attr="data-room-id=${room.room_id}"
                    th:text="${room.room_name}"
                    onclick="openChatWindow(this); return false;"></a>

                <!-- ✅ 단체방이면 인원수 뱃지 -->
                <span class="group-badge"
                      th:attr="data-room-type=${room.roomType}"
                      th:text="${room.user_count}"
                      th:style="${room.roomType == 'group' and room.user_count >= 3}
                ? 'font-size:11px;padding:2px 6px;border-radius:999px;border:1px solid #ccc;color:#555;background:#f7f7f7;display:inline-block;margin-left:6px;'
                : 'display:none;'">
                </span>
            </div>
            <div class="last-message" style="font-size: 12px;color: gray;"
                    th:text="${room.last_message}">
            </div>
        </td>

        <td style="text-align: right">
            <div class="last-time" th:text="${#temporals.format(room.last_time, 'HH:mm')}"></div>
            <span class="unread-count" th:if="${room.unread_count > 0}" style="color: red;font-weight: bold">
                [[${room.unread_count}]]
            </span>
        </td>
    </tr>
</table>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script th:inline="javascript">
    const userId = /*[[${user_id}]]*/ 0;

    const socket = new SockJS('/ws');
    const stompClient = Stomp.over(socket);

    stompClient.connect({}, function () {

        stompClient.subscribe("/topic/chat-list/" + userId, function(msg){
            const data = JSON.parse(msg.body);

            const row = document.querySelector(
                `[data-room-id="${data.roomId}"]`
            );
            if(!row) return;

            //마지막 메시지 갱신
            row.querySelector(".last-message").innerText = data.lastMessage;

            //시간 갱신
            row.querySelector(".last-time").innerText =
                new Date(data.lastTime).toLocaleTimeString([], {
                    hour: '2-digit',
                    minute: '2-digit'
                });

            row.style.backgroundColor = "#f0f8ff";
            setTimeout(() => row.style.backgroundColor = "", 300);


            //안 읽은 수 처리
            let unreadEl = row.querySelector(".unread-count");

            if (data.unreadCount > 0) {
                if (!unreadEl) {
                    unreadEl = document.createElement("span");
                    unreadEl.className = "unread-count";
                    unreadEl.style.color = "red";
                    unreadEl.style.fontWeight = "bold";
                    row.children[1].appendChild(unreadEl);
                }
                unreadEl.innerText = data.unreadCount;
                unreadEl.style.display = "inline";
            } else {
                if (unreadEl) unreadEl.style.display = "none";
            }

            if (data.unreadCount > 0) {
                moveRowToTop(row);
            }

            // ✅ 단체방 인원 뱃지 갱신
            const badge = row.querySelector(".group-badge");
            if(!badge) return;
            const cnt = data.userCount ?? 0;

            if (data.roomType === "group" && cnt >= 3) {
                badge.innerText = cnt;
                badge.style.display = "inline-block";
            } else {
                badge.style.display = "none";
            }



        });

        stompClient.subscribe("/topic/chat-room-removed/" + userId, function(msg){
            const roomId = parseInt(msg.body);
            const row = document.querySelector(`[data-room-id="${roomId}"]`);
            if(row) row.remove();
        });

    });

    function moveRowToTop(row) {
        const table = document.getElementById("chatTable");
        table.prepend(row);
    }

    window.addEventListener("pageshow", function (event) {
        if (event.persisted) {
            location.reload();
        }
    });

    function goNewChat(){
        location.href="/chat/new"
    }

    function toggleMenu() {
        event.stopPropagation();
        const menu = document.getElementById("chatMenu");
        menu.style.display =
            menu.style.display === "none" ? "block" : "none";
    }

    // 바깥 클릭 시 닫기 (선택)
    document.addEventListener("click", function (e) {
        const menu = document.getElementById("chatMenu");
        if (!e.target.closest("div")) {
            menu.style.display = "none";
        }
    });

    function openChatWindow(el){
        const roomId = el.getAttribute("data-room-id");
        const url = "/chat/room/" + roomId;

        // 같은 방이면 같은 창을 재사용(PC카톡 느낌)
        const windowName = "chat_room_" + roomId;

        // 창 옵션
        const features = "width=420,height=720,resizable=yes,scrollbars=yes";

        const w = window.open(url, windowName, features);

        // 팝업 차단 대비
        if(!w){
            alert("팝업 차단 중! 허용 후 다시 시도하세요.");
            return;
        }

        w.focus();
    }

    window.addEventListener("message", function (event) {
        if (event.origin !== window.location.origin) return;

        const data = event.data || {};
        if (data.type !== "CHAT_ROOM_LEFT") return;

        const roomId = data.roomId;

        // ✅ 목록에서 해당 방 즉시 제거
        const row = document.querySelector(`[data-room-id="${roomId}"]`);
        if (row) row.remove();
    });

</script>
</body>
</html>
