<h1>재고확인목록</h1>
<form th:action="@{/list}" th:method="get">
<!-- 상품명-->
    <input type="text" name="keyword" placeholder="상품명 또는 카테고리명" th:value="${param.keyword}">
<!--&lt;!&ndash;카테고리 드롭다운&ndash;&gt;-->

<!--                th:text="${cat.category_name}"-->

<!--        </option>-->

    <button type="submit" name="product_type" value="COLD">냉장</button>
    <button type="submit" name="product_type" value="FROZEN">냉동</button>
    <button type="submit" name="product_type" value="ROOM">상온</button>
    <button type="submit">검색</button>
</form>

    <table>
        <tr>
            <th>재고번호</th>
            <th>재고이름</th>
            <th>카테고리</th>
            <th>가격</th>
            <th>수량</th>
            <th>단위</th>
            <th>이미지</th>
            <th>제품종류</th>
        </tr>
        <tr th:each="ps : ${p}">
            <td>[[${ps.stock_id}]]</td>
            <td>[[${ps.product_name}]]</td>
            <td>[[${ps.category_path}]]</td>
            <td>[[${ps.price}]]</td>
            <td>[[${ps.quantity}]]</td>
            <td>[[${ps.unit}]]</td>
            <td>[[${ps.image_id}]]</td>
            <td>[[${ps.product_type}]]</td>
        </tr>
</table>
