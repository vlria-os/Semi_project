<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>재고확인목록</title>
    <style>
        /* 전체 테이블 스타일 */
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin-top: 20px;
        }

        th {
            background-color: #007bff;
            color: white;
            padding: 12px 15px;
            text-align: center;
            font-weight: 700;
            border: 1px solid #ddd;
        }

        td {
            padding: 10px 15px;
            text-align: center;
            border: 1px solid #ddd;
            vertical-align: middle;
            color: #333;
        }

        tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tbody tr:hover {
            background-color: #e6f0ff;
        }

        td img {
            max-width: 60px;
            max-height: 60px;
            border-radius: 6px;
        }

        /* 깔끔한 페이징 */
        .paging a {
            margin: 0 4px;
            padding: 6px 10px;
            text-decoration: none;
            border: 1px solid #007bff;
            color: #007bff;
            border-radius: 4px;
        }

        .paging a.current {
            background-color: #007bff;
            color: white;
        }

        .paging a.disabled {
            color: #ccc;
            border-color: #ccc;
            pointer-events: none;
        }
        button {
            padding: 4px 10px;
            font-size: 0.85rem;
        }

        input[type="number"] {
            width: 70px;
        }


    </style>
</head>
<body>

<h1>재고확인목록</h1>
<form th:action="@{/list}" method="get" >
    <input type="text" name="keyword" placeholder="상품명 또는 카테고리명"
           th:value="${keyword}">
    <!-- 전체 버튼: keyword와 status를 모두 비우고 페이지 1로 이동  -->
    <!-- 전체 버튼 -->
    <a th:href="@{/list}"
       style="padding:4px 8px; border:1px solid #007bff; color:#007bff; text-decoration:none; border-radius:4px;">
        전체</a>

    <!-- 상태별 버튼: keyword 유지, status만 변경 -->
    <button type="submit" name="status" value="COLD">냉장</button>
    <button type="submit" name="status" value="FROZEN">냉동</button>
    <button type="submit" name="status" value="ROOM">실온</button>
    <!-- 검색 버튼: 입력한 keyword로 검색 -->
    <button type="submit">검색</button>
</form>

<table>
    <tr>
        <th>상품번호</th>
        <th>재고이름</th>
        <th>카테고리</th>
        <th>가격</th>
        <th>수량</th>
        <th>단위</th>
        <th>이미지</th>
        <th>제품종류</th>

    </tr>
    <tr th:each="ps : ${p}">
        <td>[[${ps.product_id}]]</td>
        <td>[[${ps.product_name}]]</td>
        <td>[[${ps.category_path}]]</td>
        <td>[[${ps.price}]]</td>

        <!-- 수량 수정 폼 -->
        <td>
            <form th:action="@{/stock/update}" method="post" style="display:flex; justify-content:center; gap:4px;">
                <input type="number"
                       name="quantity"
                       th:value="${ps.quantity}"
                       min="0"
                       style="width:60px; text-align:center;">
                <input type="hidden" name="productId" th:value="${ps.product_id}">

                <button type="submit">수정</button>
            </form>
        </td>

        <td>[[${ps.unit}]]</td>
        <td>
            <img th:if="${ps.image_path != null}"
                 th:src="@{/image/{save_name}(save_name=${ps.image_path})}"
                 alt="상품이미지" style="max-width:60px; max-height:60px;">
        </td>

        <td>[[${ps.status}]]</td>
    </tr>


</table>

<!-- 통합 페이징 -->
<div class="paging" style="text-align:center; margin-top:20px;">
    <!-- 처음 페이지 -->
    <a th:href="@{/list(pagenum=1, keyword=${param.keyword}, status=${param.status})}"
       th:classappend="${pagenum == 1} ? 'disabled'"><<</a>

    <!-- 이전 페이지 -->
    <a th:href="@{/list(pagenum=${pagenum - 1}, keyword=${param.keyword}, status=${param.status})}"
       th:classappend="${pagenum == 1} ? 'disabled'"><</a>

    <!-- 페이지 번호 -->
    <span th:each="i : ${#numbers.sequence(1, totalPage)}">
        <a th:href="@{/list(pagenum=${i}, keyword=${param.keyword}, status=${param.status})}"
           th:text="${i}"
           th:classappend="${pagenum == i} ? 'current'"></a>
    </span>

    <!-- 다음 페이지 -->
    <a th:href="@{/list(pagenum=${pagenum + 1}, keyword=${param.keyword}, status=${param.status})}"
       th:classappend="${pagenum == totalPage} ? 'disabled'">></a>

    <!-- 마지막 페이지 -->
    <a th:href="@{/list(pagenum=${totalPage}, keyword=${param.keyword}, status=${param.status})}"
       th:classappend="${pagenum == totalPage} ? 'disabled'">>></a>
</div>


</body>
</html>
