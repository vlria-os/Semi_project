<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>공지 상세</title>
</head>
<body>
eld
<h2 th:text="${notice.title}"></h2>

작성자: <span th:text="${notice.writer}"></span><br><br>
작성일: <span th:text="${#temporals.format(notice.createdAt,'yyyy-MM-dd')}"></span><br><br>
조회수: <span th:text="${notice.viewCount}"></span>

<hr>
</body>
<div>
        내용 : <span th:text="${notice.content}"></span>
</div>
<br>
<table width="10%" style="white-space: nowrap;">
    <tr>
        <td width="30%"></td>
        <td align="left">
            <a th:href="@{/notice/edit/{id}(id=${notice.noticeId})}">수정</a>
        </td>
        <td align="right">
            <a th:href="@{/notice/delete/{id}(id=${notice.noticeId})}"
               onclick="return confirm('정말 삭제하시겠습니까?')">
                삭제
            </a>
        </td>
    </tr>
</table>

<br>
<table width="9%">
<tr>
<td width="10%"></td>
<td align="right">
<a href="/notice/list">목록으로</a>
</td>
</table>
</tr>
</body>
</html>
