<section xmlns:th="http://www.thymeleaf.org" th:fragment="content">
<h2>공지 수정</h2>

<form th:action="@{/notice/edit}" method="post">

    <input type="hidden" name="noticeId"
           th:value="${notice.noticeId}">

    제목<br>
    <input type="text" name="title"
           th:value="${notice.title}"
           size="25" style="height: 40px; font-size: 20px;"><br><br>

    작성자<br>
    <input type="text" name="writer"
           th:value="${notice.writer}"
           size="15" style="height: 40px; font-size: 20px;"><br><br>

    <div th:if="${session.role_id == 1}">
    고정공지<br>
    <input type="checkbox" name="pinYn" value="Y"
           style=" transform: scale(1.5);"
           th:checked="${notice.pinYn == 'Y'}"/><br><br>
    </div>
    <input th:if="${session.role_id != 1}" type="hidden" name="pinYn" th:value="${notice.pinYn}">


    내용<br>
    <textarea name="content"
              rows="10" cols="50"
              th:text="${notice.content}"></textarea><br><br>
    <button type="submit">수정</button>
    <br><br>
    <a th:href="@{/notice/detail/{id}(id=${notice.noticeId})}">
        취소
    </a>

</form>
</section>
