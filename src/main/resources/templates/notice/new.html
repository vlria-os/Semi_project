<section xmlns:th="http://www.thymeleaf.org" th:fragment="content">
    <link rel="stylesheet" th:href="@{/css/notice/new.css}">
    <div class="main">
        <h2>📌공지 등록</h2>

        <form method="post" th:action="@{/notice/new}" class="notice-form" enctype="multipart/form-data">
            <div class="form-group">
                <label>제목</label>
                <input type="text" name="title" required placeholder="제목입력">
            </div>

            <div class="form-group">
                <label>작성자</label>
                <input type="text" name="writer" required placeholder="작성자 이름" th:value="${session.webuserName}" readonly>
            </div>

            <div class="form-group checkbox-group" th:if="${session.role_id == 1}">
                <label for="pinYn">상단 고정 공지 설정</label>
                <input type="checkbox" name="pinYn" value="Y" id="pinYn"
                       th:checked="${notice?.pinYn == 'Y'}"/>
            </div>

            <div class="form-group">
                <label>내용</label>
                <textarea name="content" rows="12" placeholder="공지 내용 작성"></textarea>
            </div>

            <div class="form-group">
                <label>첨부파일</label>
                <input type="file" name="file" class="file-input">
            </div>

            <div class="button-group">
                <button type="submit" class="btn-submit">등록</button>
                <a href="/notice/list" class="btn-cancel">목록으로</a>
            </div>
        </form>
    </div>

</section>
