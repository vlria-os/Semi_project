<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      text-align: center;
    }

    th {
      background: #eee;
    }

    input, button {
      padding: 4px;
    }

    a {
      display: inline-block;
      margin-top: 10px;
    }
  </style>
</head>
<body>
<table>
  <thead>
    <tr>
      <th>상품번호</th>
      <th>이미지</th>
      <th>상품명</th>
      <th>단위</th>
      <th>가격</th>
      <th>분류</th>
      <th>카테고리</th>
    </tr>
  </thead>
  <tbody id="productBody">
    <tr th:each="l:${list}">
      <td th:text="${l.product_id}"></td>
      <td><img th:src="@{'/image/' + ${l.save_name}}" style="width:100px;"></td>
      <td th:text="${l.product_name}"></td>
      <td th:text="${l.unit}"></td>
      <td th:text="${l.price}"></td>
      <td th:text="${l.status}"></td>
      <td th:text="${l.category}"></td>
    </tr>
  </tbody>
</table>

<div>
  <input type="text" id="keyword" name="keyword" placeholder="상품명 또는 카테고리명"
         onkeydown="if(event.key === 'Enter'){ event.preventDefault(); search(); }">
  <button type="submit" onclick="search()">검색</button>
</div>

<a th:href="@{/common/product_insert}">상품등록</a>

<script>
  function search(){
    const keyword=document.getElementById("keyword").value;

    fetch(`/common/product_search?keyword=${encodeURIComponent(keyword)}`)
            .then(res=>res.json())
            .then(list=>{
              const tbody=document.getElementById('productBody');
              tbody.innerHTML='';

              list.forEach(p=>{
                tbody.innerHTML += `
                    <tr>
                        <td>${p.product_id}</td>
                        <td>${p.product_name}</td>
                        <td>${p.unit}</td>
                        <td>${p.price}</td>
                        <td>${p.status}</td>
                        <td>${p.category}</td>
                    </tr>
                `;
              })
            })
  };
</script>
</body>
</html>
