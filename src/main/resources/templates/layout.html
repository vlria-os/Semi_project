<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title} ?: 'My Service'">My Service</title>
    <link rel="stylesheet" th:href="@{/css/layout.css}">
</head>

<body>
<!-- HEADER -->
<header th:replace="~{fragment/header :: header}"></header>

<div class="layout-container">
    <!-- SIDEBAR (고정 UI) -->
    <aside class="sidebar"
           th:replace="~{fragment/sidebar :: sidebar}">
    </aside>

    <div class="layout-body">
        <!-- NAV (권한별로 교체됨) -->
        <nav class="nav"
             th:replace="~{${navFragment}}">
        </nav>

        <!-- MAIN CONTENT -->
        <main class="content">
            <section th:replace="~{${content}}"></section>
        </main>
    </div>
</div>

<!-- FOOTER -->
<footer th:replace="~{fragment/footer :: footer}"></footer>

<!-- ✅ CHAT PANEL (공통) -->
<div id="chatPanel" class="chat-panel" style="display:none;">
    <div class="chat-panel-header">
        <span>채팅</span>
        <button type="button" class="chat-close" onclick="toggleChat()">✖</button>
    </div>

    <iframe id="chatFrame"
            th:src="@{/chat/list}"
            style="width:100%; height:calc(100% - 44px); border:0;">
    </iframe>
</div>

<!-- ✅ CHAT TOGGLE JS (공통) -->
<script>
    // 헤더 fragment의 onclick에서 항상 접근 가능하게 전역으로 등록
    window.toggleChat = function () {
        const panel = document.getElementById("chatPanel");
        if (!panel) return;

        const open = panel.style.display === "block";
        panel.style.display = open ? "none" : "block";
    };

    document.addEventListener("click",(e) => {
        const btn = e.target.closest("#btnCheckIn");
        const btn2 = e.target.closest("#btnCheckOut");

        if(!btn) return;

        const btnOut = document.getElementById("btnCheckOut"); // ✅ 여기!
        const btnIn  = document.getElementById("btnCheckIn");

        fetch('/work/checkIn')
            .then(resp => resp.text())
            .then(data => {
                alert(data.trim() === "success" ? "출근 성공!" : "출근 실패!");

                if (data.trim() === "success") {          // ✅ 성공일 때만 토글
                    btnIn.style.display = "none";
                    if (btnOut) btnOut.style.display = "inline-flex";
                }
            })
            .catch(error => {
                console.error(error);
                alert("요청 실패! 콘솔을 확인하세요!");
            });
    });

    document.addEventListener("click",(e) => {
        const btn=e.target.closest("#btnCheckOut");
        const btn2=e.target.closest("#btnCheckIn");

        if(!btn) return;

        const btnOut = document.getElementById("btnCheckOut");
        const btnIn  = document.getElementById("btnCheckIn");

        fetch('/work/checkOut')
            .then(resp => resp.text())
            .then(data => {
                alert(data.trim() === "success" ? "퇴근 성공!" : "퇴근 실패!");

                if (data.trim() === "success") {
                    btnOut.style.display = "none";
                    if (btnIn) btnIn.style.display = "inline-flex";
                }
            })
            .catch(error => {
                console.error(error);
                alert("요청 실패! 콘솔을 확인하세요!");
            });
    });

    async function refreshTotalUnread(){
        try{
            const res = await fetch("/chat/unread/total");
            const total = await res.json();

            const badge = document.getElementById("chatUnreadBadge");
            if (!badge) return;

            if (total > 0){
                badge.textContent = total > 99 ? "99+" : total;
                badge.style.display = "flex";
            } else {
                badge.style.display = "none";
            }
        } catch(e){
            console.error(e);
        }
    }

    // 페이지 로드시 1번
    refreshTotalUnread();

    setInterval(refreshTotalUnread, 500);

</script>

</body>
</html>
