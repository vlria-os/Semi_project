<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title} ?: 'My Service'">My Service</title>
    <link rel="stylesheet" th:href="@{/css/layout.css}">
</head>

<body>

<header class="header">
    <div class="header-left">
        <a th:href="@{/notice/list}" class="logo"><img src="/css/HSWH.svg"></a>
        <nav class="header-nav" th:replace="~{${navFragment}}"/>
    </div>

    <div class="header-right">
        <!-- 미퇴근 기록 없을 때 -->
        <button type="button"
                id="btnCheckIn"
                th:if="${session.openLog == null}">
            출근
        </button>
        <!-- 미퇴근 기록 있는데 오늘일 때 -->
        <button type="button"
                id="btnCheckOut"
                th:if="${session.openLog != null
                and session.openLog.workingDate == session.today}">
            퇴근
        </button>
    <div th:replace="~{fragment/header :: .header-right}"></div>

    </div>
</header>

<div class="layout-container">
    <div class="layout-body">
        <main class="content">
            <section th:replace="~{${content}}"/>
        </main>
    </div>
    <aside class="sidebar" th:replace="~{fragment/sidebar :: sidebar}"/>
</div>

<footer th:replace="~{fragment/footer :: footer}"/>

<div id="checkOut-Overlay" style="display: none">
    <div id="checkOut-Area">
        <div id="checkOut-Box">
            <div id="checkOut-Title">퇴근 처리</div>
            <div id="checkOut-Content">
                <span>퇴근 유형</span>
                <select id="attendStatus">
                    <option value="WORK">정상 퇴근</option>
                    <option value="HALF_AM">오전 반차</option>
                    <option value="HALF_PM">오후 반차</option>
                    <option value="ANNUAL">연차</option>
                    <option value="SICK">병가</option>
                    <option value="ETC">기타</option>
                </select>
            </div>
            <div id="checkOut-Memo">
                <span>메모(선택)</span>
                <input type="text" id="checkOutMemo" placeholder="사유/메모 입력">
            </div>
            <div id="checkOut-Btn">
                <button type="button" onclick="checkOutOk()">확인</button> <button type="button" onclick="checkOutNo()">취소</button>
            </div>
        </div>
    </div>
</div>

    function openChatWindow(){
        window.open(
            "/chat/list",   // ✅ 기존 채팅 목록 페이지
            "chatWindow",   // 창 이름 (같은 이름이면 하나만 열림)
            "width=420,height=640,resizable=no,scrollbars=yes"
        );
    }

    //출근
    document.addEventListener("click",(e) => {
        const btn = e.target.closest("#btnCheckIn");

        if(!btn) return;

        fetch('/work/checkIn')
            .then(resp => resp.text())
            .then(data => {
                alert(data.trim() === "success" ? "출근 성공!" : "출근 실패!");

                location.reload(); //새로고침
            })
            .catch(error => {
                console.error(error);
                alert("요청 실패! 콘솔을 확인하세요!");
            });
    });

    //퇴근 버튼 클릭
    document.addEventListener("click",(e) => {
        const btn = e.target.closest("#btnCheckOut");
        const checkOutArea=document.getElementById("checkOut-Overlay");

        if(!btn) return;

        checkOutArea.style.display="block";
    });

    //퇴근 유형 선택 취소
    function checkOutNo(){
        const checkOutArea=document.getElementById("checkOut-Overlay");
        checkOutArea.style.display="none";
        document.getElementById("attendStatus").value = "WORK";
        document.getElementById("checkOutMemo").value = "";
    }

    //퇴근
    function checkOutOk(){
        const attendStatus=document.getElementById("attendStatus").value;
        const memo=document.getElementById("checkOutMemo").value;

        fetch('/work/checkOut', {
            method:'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                attendStatus: attendStatus,
                memo: memo
            })
        })
            .then(resp => resp.text())
            .then(data => {
                if(data.trim() === "success"){
                    alert('퇴근 성공!');
                    location.reload();
                }else {
                    alert('퇴근 실패!');
                    location.reload();
                }
            });
    }

    document.addEventListener("DOMContentLoaded", function(){
        const navLinks=document.querySelectorAll(".nav-tabs a");
        navLinks.forEach(link => {
            link.addEventListener("click", function(){
                navLinks.forEach(l => l.classList.remove("active"));
                this.classList.add("active");
            });
        });
    });

    function goMyWorkingLog(){
        const returnUrl=window.location.pathname + window.location.search;
        location.href = "/work/calendar?returnUrl=" + encodeURIComponent(returnUrl);
    }

    function updateChatUnreadBadgeFromTotal(total) {
        const badge = document.getElementById('chatUnreadBadge');
        if (!badge) return;

        if (Number(total) > 0) {
            badge.style.display = 'inline-block';
            badge.textContent = '1';   // 하나라도 있으면 1
        } else {
            badge.style.display = 'none';
            badge.textContent = '0';
        }
    }

    function refreshChatUnreadBadge() {
        fetch('/chat/unread/total', { credentials: 'same-origin' })
            .then(async (res) => {
                if (!res.ok) throw new Error('HTTP ' + res.status);

                // ✅ int는 json이 아니라 text로 온다
                const txt = await res.text();
                const total = parseInt(txt, 10);

                if (Number.isNaN(total)) throw new Error('NaN: ' + txt);

                updateChatUnreadBadgeFromTotal(total);
            })
            .catch((e) => {
                console.log('[unread] fetch failed:', e);
                // ❌ 실패했다고 0으로 숨기면 “깜빡임/영원히 안뜸” 생김
                // 그냥 유지해.
            });
    }

    document.addEventListener('DOMContentLoaded', refreshChatUnreadBadge);

    const headerUserId = /*[[${session.webuser_id}]]*/ 0;

    console.log("[HEADER] loaded, userId =", headerUserId);

    if (headerUserId > 0) {
        const socket = new SockJS('/ws');
        const stomp = Stomp.over(socket);
        stomp.debug = null;

        stomp.connect({}, () => {
            console.log("[HEADER] stomp connected");

            stomp.subscribe("/topic/chat-list/" + headerUserId, () => {
                console.log("[HEADER] chat-list event");
                refreshChatUnreadBadge();
            });
        });
    }
