<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품조회</title>
    <link rel="stylesheet"
          href="http://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<header>
    <h2>상품관리</h2>
</header>

<nav class="menu">
    <a href="#" class="active">상품조회</a>
    <a th:href="@{/product/new}">+ 상품등록</a>
</nav>
<!-- 상품카드 목록-->
<div class="product-list">
<div class="product-card" th:each="p : ${products}">
    <img th:src="@{${p.filePath}}" alt="상품이미지">
    <h4 th:text="${p.productName}">상품명</h4>
    <p>가격 <span th:text="${p.price} + '원'">0원</span></p>
    <span th:text="${p.productType}">ROOM</span>
</div>

</div>

</body>
</html>
