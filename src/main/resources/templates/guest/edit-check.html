<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 확인</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <h1 class="board-title">비밀번호 확인</h1>
    <!--비밀번호 입력 전용-->

    <form th:action="@{/guest/edit/check}" method="post">
        <input type="hidden" name="id" th:value="${id}"/>
        <label>비밀번호</label>
        <input type="password" name="password" required/><br/>

        <p th:if="${error}" th:text="${error}" class="error"></p>

        <div class="button-group">
            <button type="submit">확인</button>
            <a th:href="@{/guest/view/{id}(id=${id})}"><button type="button">취소</button></a>
        </div>
    </form>
</div>
</body>
</html>
