<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:if="${mode == 'edit'}">글 수정</title>
    <title th:unless="${mode == 'edit'}">글쓰기</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <!-- 제목 -->
    <h1 class="board-title" th:if="${mode == 'edit'}">글 수정</h1>
    <h1 class="board-title" th:unless="${mode == 'edit'}">글쓰기</h1>

    <!-- 수정 모드 -->
    <form th:if="${mode == 'edit'}" th:action="@{/guest/edit}" method="post">
        <input type="hidden" name="id" th:value="${board.id}" />

        <label>작성자</label>
        <input type="text" name="name" th:value="${board.name}" th:readonly="true"/><br/>

        <label>비밀번호</label>
        <input type="password" name="password" required/><br/>

        <label>제목</label>
        <input type="text" name="title" th:value="${board.title}"/><br/>

        <label>카테고리</label>
        <select name="category">
            <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}" th:selected="${board.category == cat}"></option>
        </select><br/>

        <label>내용</label>
        <textarea name="content" rows="5" th:text="${board.content}"></textarea><br/>

        <p th:if="${error}" th:text="${error}" class="error"></p>

        <div class="button-group">
            <button type="submit">수정</button>
            <a th:href="@{/guest/view/{id}(id=${board.id})}" class="btn-cancel">취소</a>
        </div>
    </form>

    <!-- 등록 모드 -->
    <form th:unless="${mode == 'edit'}" th:action="@{/guest/write}" method="post">
        <label>작성자</label>
        <input type="text" name="name" th:value="${board.name}"/><br/>

        <label>비밀번호</label>
        <input type="password" name="password" required/><br/>

        <label>제목</label>
        <input type="text" name="title" th:value="${board.title}"/><br/>

        <label>카테고리</label>
        <select name="category">
            <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}" th:selected="${board.category == cat}"></option>
        </select><br/>

        <label>내용</label>
        <textarea name="content" rows="5" th:text="${board.content}"></textarea><br/>

        <p th:if="${error}" th:text="${error}" class="error"></p>

        <div class="button-group">
            <button type="submit">등록</button>
            <a th:href="@{/guest/list}" class="btn-cancel">취소</a>
        </div>
    </form>

</div>
</body>
</html>
