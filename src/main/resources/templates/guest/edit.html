<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>글 수정</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <h1 class="board-title">글 수정</h1>
    <!--실제 수정 폼-->
    <form th:action="@{/guest/edit}" method="post">
        <input type="hidden" name="id" th:value="${board.id}" />

        <label>비밀번호:</label>
        <input type="password" name="password" required/><br/>

        <label>카테고리</label>
        <select name="category">
            <option th:each="c:${categories}"
                    th:value="${c}"
                    th:text="${c}"
                    th:selected="${c==board.category}">
            </option>
        </select></br>

        <label>제목</label>
        <input type="text" name="title" th:value="${board.title}" /><br/>

        <label>내용</label>
        <textarea name="content" rows="5" th:text="${board.content}"></textarea><br/>

        <p th:if="${error}" th:text="${error}" class="error"></p>

        <div class="button-group">
            <button type="submit">수정</button>
            <a th:href="@{/guest/view/{id}(id=${board.id})}" class="btn-cancel">취소</a>
        </div>
     </form>
    </div>
</body>
</html>
