<section xmlns:th="http://www.thymeleaf.org"
         th:fragment="content">
  <div class="main">
    <button><a th:href="@{/content/requestList/office}">입고</a></button>
    <button><a th:href="@{/content/requestList_out/office}">출고</a></button>
    <table>
      <tr>
        <th>출고 번호</th><th>승인 상태</th><th>승인일</th>
      </tr>
      <tr th:each="l:${list}">
        <td th:text="${l.outbound_id}"></td>
        <td th:text="${l.approval_status}"></td>
        <td th:text="${l.request_date}"></td>
        <td><button type="button"
                    th:attr="data-out-id=${l.outbound_id}"
                    onclick="showOutDetail(this)">상세보기</button></td>
      </tr>
    </table>
    <div>
      <ul id="pagingArea" th:if="${pageInfo != null and pageInfo.totalPageCount > 1}">
        <li th:if="${pageInfo.startPageNum > 1}">
          <a th:href="@{/content/requestList_out/office(pageNum=${pageInfo.startPageNum - 1})}">이전</a>
        </li>
        <li th:each="num:${#numbers.sequence(pageInfo.startPageNum,pageInfo.endPageNum)}">
          <a th:href="@{/content/requestList_out/office(pageNum=${num})}">[[${num}]]</a>
        </li>
        <li th:if="${pageInfo.endPageNum < pageInfo.totalPageCount}">
          <a th:href="@{/content/requestList_out/office(pageNum=${pageInfo.endPageNum + 1})}">다음</a>
        </li>
      </ul>
    </div>
  </div>

  <script>
    function showOutDetail(btn){
      const currentTr = btn.closest("tr");
      const colCount = currentTr.children.length;

      // 이미 상세 row 있으면 토글
      if (currentTr.nextElementSibling &&
              currentTr.nextElementSibling.classList.contains("detailRow")) {
        currentTr.nextElementSibling.remove();
        return;
      }

      const bound_id = btn.dataset.outId;

      fetch(`/content/requestList_out/office/out?outbound_id=${bound_id}`)
              .then(resp => resp.json())
              .then(list => {
                console.log(list);

                const detailRow = document.createElement("tr");
                detailRow.classList.add("detailRow");

                const td = document.createElement("td");
                td.setAttribute("colspan", colCount);

                // 테이블 만들기
                let innerTable = `<table class="detailTable" style="width:100%; border:1px solid #ccc; border-collapse: collapse;">
                          <tr>
                              <th>요청자</th>
                              <th>상품명</th>
                              <th>수량</th>
                              <th>요청 상태</th>
                              <th>입고 상태</th>
                              <th>사유</th>
                          </tr>`;

                list.forEach(l => {
                  const showReasonBtn =
                          (l.approval_status === 'REJECTED' || l.outbound_status === 'REJECTED')
                                  ? `<button type="button" onclick="showReason(this)">사유</button>`
                                  : ``;

                  innerTable += `<tr data-detail-id="${l.outbound_detail_id}",
                                     data-reason="${l.reason ?? ''}">
                    <td>${l.webuser_id}</td>
                    <td>${l.product_name}</td>
                    <td>${l.quantity}</td>
                    <td>${l.approval_status}</td>
                    <td>${l.outbound_status}</td>
                    <td>${showReasonBtn}</td>
                 </tr>`;
                });

                innerTable += `</table>`;

                td.innerHTML = innerTable;
                detailRow.appendChild(td);

                currentTr.after(detailRow); // 현재 tr 바로 아래에 삽입
              })
              .catch(err => console.error(err));
    }

    function showReason(btn) {
      const tr = btn.closest("tr");

      // 이미 사유 row 있으면 토글
      if (tr.nextElementSibling &&
              tr.nextElementSibling.classList.contains("reasonRow")) {
        tr.nextElementSibling.remove();
        return;
      }

      const reason = tr.dataset.reason;

      const reasonTr = document.createElement("tr");
      reasonTr.classList.add("reasonRow");

      reasonTr.innerHTML = `
    <td colspan="${tr.children.length}"
        style="background:#f9f9f9; color:#c00;">
      사유: ${reason || '사유 없음'}
    </td>
  `;
      tr.after(reasonTr);
    }

  </script>

</section>
