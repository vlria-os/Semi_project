<section xmlns:th="http://www.thymeleaf.org"
         th:fragment="content">
    <link rel="stylesheet" th:href="@{/css/content/requestlist.css}">
    <div class="main">

        <div class="main-title">출고승인목록</div>

        <div class="nav-toggle">
            <button onclick="goinbound()" class="view-btn">입고</button>
            <button onclick="gooutbound()" class="view-btn active">출고</button>
        </div>
        <table id="Table">
            <tr>
                <th>상품명</th><th>요청자</th><th>요청일</th><th>상세보기</th>
            </tr>
            <tr th:each="l:${list}">
                <td th:text="${l.product_name}"></td>
                <td th:text="${l.webuser_name}"></td>
                <td th:text="${#temporals.format(l.request_date, 'yyyy-MM-dd HH:mm:ss')}"></td>
                <td><button type="button"
                            th:attr="data-outbound-id=${l.outbound_id}"
                            onclick="showOutDetail(this)">상세보기</button></td>
            </tr>
        </table>
        <div id="pagingArea"  th:if="${pageInfo != null and pageInfo.totalPageCount > 1}">
            <ul id="serverPaging">
                <li th:if="${pageInfo.startPageNum > 1}">
                    <a th:href="@{/content/requestList_admin_out(pageNum=${pageInfo.startPageNum - 1})}">이전</a>
                </li>
                <li th:each="num:${#numbers.sequence(pageInfo.startPageNum,pageInfo.endPageNum)}">
                    <a th:href="@{/content/requestList_admin_out(pageNum=${num})}">[[${num}]]</a>
                </li>
                <li th:if="${pageInfo.endPageNum < pageInfo.totalPageCount}">
                    <a th:href="@{/content/requestList_admin_out(pageNum=${pageInfo.endPageNum + 1})}">다음</a>
                </li>
            </ul>
            <ul id="ajaxPaging" style="display: none"></ul>
        </div>
    </div>
    <script th:inline="javascript">

        function goinbound(){
            location.href="/content/requestList_admin";
        }

        function gooutbound(){
            location.href="/content/requestList_admin_out";
        }

        let status = /*[[${status}]]*/ null;
        let msg = /*[[${msg}]]*/ null;

        if (status && msg) {
            alert(msg);
        }

        function showOutDetail(btn) {
            const currentTr = btn.closest("tr");
            const colCount = currentTr.children.length;

            // 이미 상세 row 있으면 토글
            if (currentTr.nextElementSibling &&
                currentTr.nextElementSibling.classList.contains("detailRow")) {
                currentTr.nextElementSibling.remove();
                return;
            }

            const outboundId =btn.dataset.outboundId;

            fetch(`/request/admin/outbound?outbound_id=${outboundId}`)
                .then(resp => resp.json())
                .then(data => {
                    const detailRow = document.createElement("tr");
                    detailRow.classList.add("detailRow");

                    const td = document.createElement("td");
                    td.setAttribute("colspan", colCount);

                    let innerTable = `<table class="detailTable" style="width:100%;">
                                <tr>
                                    <th>상품명</th>
                                    <th>상품 이미지</th>
                                    <th>수량</th>
                                    <th>요청 상세</th>
                                    <th>승인/반려</th>
                                </tr>`;

                    data.forEach(l => {
                        innerTable += `<tr data-detail-id="${l.outbound_detail_id}"
                                        data-outbound-id="${l.outbound_id}"
                                        data-quantity="${l.quantity}">
                                    <td>${l.product_name}</td>
                                    <td><img src="/image/${l.save_name}"
                                        style="width:50px; height:50px; border-radius: 4px; object-fit: cover;"></td>
                                    <td>${l.quantity}</td>
                                    <td>${l.approval_status}</td>
                                    <td>
                                        <button type="button" onclick="approveItem(this)">승인</button>
                                        <button type="button" onclick="rejectItem(this)">반려</button>
                                    </td>
                                </tr>`;

                    });

                    innerTable += `
                                <tr class="detail-footer">
                                    <td colspan="5" style="text-align: right; padding: 15px;">
                                        <button type="button" class="all-approve-btn" data-io-id="${outboundId}" onclick="allApprove(this)">✨ 전체 수락</button>
                                    </td>
                                </tr>
                                </table>`;
                    td.innerHTML = innerTable;
                    detailRow.appendChild(td);
                    currentTr.insertAdjacentElement("afterend", detailRow);
                });
        }

        function approveItem(btn){
            const tr = btn.closest("tr");

            const detailId = tr.dataset.detailId;
            const quantity = tr.dataset.quantity;
            const outboundId=tr.dataset.outboundId;

            if (!confirm("이 항목을 승인하시겠습니까?")) return;


            const params = new URLSearchParams();
            params.append("outbound_id", outboundId);
            params.append("outbound_detail_id", detailId);
            params.append("quantity", quantity);// DTO 필드 이름과 맞춰야 함
            params.append("approval_status", "APPROVED"); // DTO 필드 이름과 맞춰야 함

                fetch(`/admin/outbound_app`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: params.toString()
                })
                    .then(resp => resp.json())
                    .then(data => {
                        if (data.success) {
                            alert("승인 완료");

                            // 기존 상세 행 삭제
                            const detailRow = tr.closest("tr.detailRow");
                            if (detailRow) detailRow.remove();

                            // 새로 받아온 상세 리스트로 다시 추가
                            const list = data.detailList;
                            const name = data.names;

                            const newDetailRow = document.createElement("tr");
                            newDetailRow.classList.add("detailRow");

                            const td = document.createElement("td");
                            td.setAttribute("colspan", tr.children.length);

                            let innerTable = `<table class="detailTable" border="1" style="width:100%;">
                                    <tr>
                                        <th>상품명</th>
                                        <th>수량</th>
                                        <th>요청 상세</th>
                                        <th>승인/반려</th>
                                    </tr>`;

                            list.forEach(item => {
                                const d = item.outbound_detail_id;
                                const n = name[String(d)];

                                innerTable += `<tr data-item-id="${item.outbound_detail_id}" >
                                    <td>${n}</td>
                                    <td>${item.quantity}</td>
                                    <td>${item.approval_status}</td>
                                    <td>
                                        <button type="button" onclick="approveItem(this)">승인</button>
                                        <button type="button" onclick="rejectItem(this)">반려</button>
                                    </td>
                                </tr>`;
                            });

                            innerTable += `</table>`;
                            td.innerHTML = innerTable;
                            newDetailRow.appendChild(td);
                            tr.insertAdjacentElement("afterend", newDetailRow);
                        } else {
                            alert("승인 실패: "+data.reason);
                        }
                        location.reload();
                    })
        }


        function rejectItem(btn){
            const tr = btn.closest("tr");

            if (tr.nextElementSibling && tr.nextElementSibling.classList.contains("rejectRow")) {
                return;
            }

            const rejectRow = document.createElement("tr");
            rejectRow.classList.add("rejectRow");

            const td = document.createElement("td");
            td.setAttribute("colspan", tr.children.length);

            td.innerHTML = `
        <label>반려 사유: </label>
        <input type="text" id="rejectReason" placeholder="사유 입력">
        <button type="button" onclick="submitReject(this)">제출</button>
        <button type="button" onclick="cancelReject(this)">취소</button>
    `;

            rejectRow.appendChild(td);
            tr.insertAdjacentElement("afterend", rejectRow);

        }

        function submitReject(btn){
            const rejectRow = btn.closest("tr");
            const reason = rejectRow.querySelector("#rejectReason").value;

                const detailRow = rejectRow.previousElementSibling; // 상세 테이블 행
                const detailId = detailRow.dataset.detailId; // inbound_detail_id
                const outboundId = detailRow.dataset.outboundId; // 상위 inbound ID

                if (!reason.trim()) {
                    alert("사유를 입력하세요.");
                    return;
                }

                // form-urlencoded 형식으로 보내기 (승인 함수와 동일 구조)
                const params = new URLSearchParams();
                params.append("outbound_id", outboundId);          // 쿼리 파라미터로 넘어가는 inbound_id
                params.append("outbound_detail_id", detailId);    // DTO 필드
                params.append("approval_status", "REJECTED");    // DTO 필드
                params.append("reason", reason);                 // DTO 필드

                fetch(`/admin/outbound_app`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: params.toString()
                })
                    .then(resp => resp.json())
                    .then(data => {
                        if (data.success) {
                            alert("반려 완료");

                            // 기존 상세 행 삭제
                            const detailRowContainer = detailRow.closest("tr.detailRow");
                            if (detailRowContainer) detailRowContainer.remove();

                            // 새로 받아온 상세 리스트로 다시 추가
                            const list = data.detailList;
                            const name = data.names;

                            const newDetailRow = document.createElement("tr");
                            newDetailRow.classList.add("detailRow");

                            const td = document.createElement("td");
                            td.setAttribute("colspan", detailRow.children.length);

                            let innerTable = `<table class="detailTable" border="1" style="width:100%;">
                                <tr>
                                    <th>상품명</th>
                                    <th>수량</th>
                                    <th>요청 상세</th>
                                    <th>승인/반려</th>
                                </tr>`;

                            list.forEach(item => {
                                const d = item.outbound_detail_id;
                                const n = name[String(d)];

                                innerTable += `<tr data-detail-id="${item.outbound_detail_id}"
                                                data-quantity="${item.quantity}>
                                    <td>${n}</td>
                                    <td>${item.quantity}</td>
                                    <td>${item.approval_status}</td>
                                    <td>
                                        <button type="button" onclick="approveItem(this)">승인</button>
                                        <button type="button" onclick="rejectItem(this)">반려</button>
                                    </td>
                                </tr>`;
                            });

                            innerTable += `</table>`;
                            td.innerHTML = innerTable;
                            newDetailRow.appendChild(td);
                            detailRow.closest("tr.detailRow").insertAdjacentElement("afterend", newDetailRow);

                        } else {
                            alert("반려 실패");
                        }
                        location.reload();
                    });
        }

        function cancelReject(btn){
            const rejectRow = btn.closest("tr");
            rejectRow.remove();
        }

        function allApprove(btn){
            if (!confirm("정말 전체 승인하시겠습니까?")) return;

            const tr = btn.closest("tr");
            const detailRow = tr.closest("table").querySelectorAll("tr[data-detail-id]");
            const approveList = [];
            detailRow.forEach(r => {
                        approveList.push({
                            outbound_id: r.dataset.outboundId,
                            outbound_detail_id: Number(r.dataset.detailId),
                            quantity: Number(r.dataset.quantity),
                            approval_status: "APPROVED"
                        });
                    });
                fetch(`/admin/outbound_app/all`, {
                    method: 'POST',
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(approveList)
                })
                    .then(resp => resp.json())
                    .then(data => {
                        if (data.success) {
                            alert("승인 완료");

                            // 기존 상세 행 삭제
                            const detailRow = tr.closest("tr.detailRow");
                            if (detailRow) detailRow.remove();

                            // 새로 받아온 상세 리스트로 다시 추가
                            const list = data.detailList;
                            const name = data.names;

                            const newDetailRow = document.createElement("tr");
                            newDetailRow.classList.add("detailRow");

                            const td = document.createElement("td");
                            td.setAttribute("colspan", tr.children.length);

                            let innerTable = `<table class="detailTable" border="1" style="width:100%;">
                                    <tr>
                                        <th>상품명</th>
                                        <th>수량</th>
                                        <th>요청 상세</th>
                                        <th>승인/반려</th>
                                    </tr>`;

                            list.forEach(item => {
                                const d = item.outbound_detail_id;
                                const n = name[String(d)];

                                innerTable += `<tr data-item-id="${item.outbound_detail_id}">
                                    <td>${n}</td>
                                    <td>${item.quantity}</td>
                                    <td>${item.approval_status}</td>
                                    <td>
                                        <button type="button" onclick="approveItem(this)">승인</button>
                                        <button type="button" onclick="rejectItem(this)">반려</button>
                                    </td>
                                </tr>`;
                            });

                            innerTable += `</table>`;
                            td.innerHTML = innerTable;
                            newDetailRow.appendChild(td);
                            tr.insertAdjacentElement("afterend", newDetailRow);

                        } else {
                            alert("승인 실패: "+data.reason);
                        }

                    })
        }

    </script>
</section>
