<section xmlns:th="http://www.thymeleaf.org"
         th:fragment="content">
    <link rel="stylesheet" th:href="@{/css/content/outbound_req.css}">
<div class="main">
    <h1>출고 요청</h1>
    <div class="search-container">
        <div class="search-bar">
            <form th:action="@{/stockList/req}" method="get" style="display: flex; gap: 8px;">
                <input type="text" placeholder="상품명 또는 카테고리" name="keyword" th:value="${keyword}">
                <input type="hidden" name="status" th:value="${status}">
                <input type="submit" value="검색">
            </form>
        </div>
        <div class="btn-area">
            <button type="button" id="resetOutboundSelection">선택 초기화</button>
            <button type="button" onclick="submitOutbound()">출고 요청</button>
        </div>
    </div>

    <div class="filter-group">
        <form th:action="@{/stockList/req}" method="get">
            <input type="hidden" name="keyword" th:value="${keyword}">
            <button type="submit" th:classappend="${status == null or status == ''} ? 'active' : ''">전체</button>
            <button type="submit" name="status" value="COLD"th:classappend="${status == 'COLD'} ? 'active' : ''">냉장</button>
            <button type="submit" name="status" value="ROOM" th:classappend="${status == 'ROOM'} ? 'active' : ''">실온</button>
            <button type="submit" name="status" value="FROZEN" th:classappend="${status == 'FROZEN'} ? 'active' : ''">냉동</button>
        </form>
    </div>

    <form id="outboundForm" method="post" action="/content/outbound_req">
    <table>
        <tr>
            <th>선택</th>
            <th>재고번호</th>
            <th>재고이름</th>
            <th>카테고리</th>
            <th>가격</th>
            <th>재고수량</th>
            <th>단위</th>
            <th>이미지</th>
            <th>제품종류</th>
            <th>출고수량</th>

        </tr>
        <tr th:each="ps, stat : ${p}" th:if="${ps != null}">
            <td>
                <input type="checkbox"
                       class="rowCheck"
                       onchange="toggleQty(this)">
            </td>

            <td>
                <span th:text="${ps.product_id}"></span>
                <input type="hidden"
                       class="productId"
                       th:value="${ps.product_id}"
                       disabled>
            </td>
            <td th:text="${ps.product_name}"></td>
            <td th:text="${ps.category_path}"></td>
            <td th:text="${ps.price}"></td>
            <td th:text="${ps.quantity}" class="stockQty"></td>
            <td th:text="${ps.unit}"></td>
            <td>
                <img th:src="@{'/image/' + ${ps.save_name}}" style="width:100px;">
            </td>

            <td th:text="${ps.status}"></td>
            <td>
                <input type="number"
                       class="reqQty"
                       th:name="|outbound_reqDtos[${stat.index}].quantity|"
                       min="1"
                       disabled>

            </td>
        </tr>
    </table>

    </form>
    <div class="pagination_wrap">
        <ul th:if="${pageInfo != null and pageInfo.totalPageCount > 1}">
            <li th:if="${pageInfo.startPageNum > 1}">
                <a th:href="@{/content/outbound_req(pageNum=${pageInfo.startPageNum - 1}, status=${status}, keyword=${keyword})}">[이전]</a>
            </li>
            <li th:each="num:${#numbers.sequence(pageInfo.startPageNum,pageInfo.endPageNum)}">
                <a th:href="@{/content/outbound_req(pageNum=${num},status=${status},keyword=${keyword})}">[[${num}]]</a>
            </li>
            <li th:if="${pageInfo.endPageNum < pageInfo.totalPageCount}">
                <a th:href="@{/content/outbound_req(pageNum=${pageInfo.endPageNum + 1}, status=${status}, keyword=${keyword})}">[다음]</a>
            </li>
        </ul>
    </div>
</div>
    <script>
        const selectedOutboundMap = {};

        function toggleQty(checkbox){
            const tr = checkbox.closest('tr');
            const qtyInput = tr.querySelector('.reqQty');
            const productInput = tr.querySelector('.productId');
            const productId = productInput.value;

            if(checkbox.checked){
                qtyInput.disabled = false;
                productInput.disabled = false;
                qtyInput.focus();

                selectedOutboundMap[productId] = { qty: qtyInput.value || '' };
            } else {
                qtyInput.disabled = true;
                qtyInput.value = '';
                productInput.disabled = true;

                delete selectedOutboundMap[productId];
            }

            sessionStorage.setItem('selectedOutboundMap', JSON.stringify(selectedOutboundMap));
        }

        document.addEventListener('input', e => {
            if(e.target.classList.contains('reqQty')){
                const tr = e.target.closest('tr');
                const productId = tr.querySelector('.productId').value;
                if(selectedOutboundMap[productId]){
                    selectedOutboundMap[productId].qty = e.target.value;
                    sessionStorage.setItem('selectedOutboundMap', JSON.stringify(selectedOutboundMap));
                }
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            const savedMap = JSON.parse(sessionStorage.getItem('selectedOutboundMap') || '{}');

            Object.keys(savedMap).forEach(productId => {
                const row = Array.from(document.querySelectorAll('#outboundForm table tr'))
                    .find(tr => tr.querySelector('.productId') && tr.querySelector('.productId').value === productId);

                if(row){
                    const checkbox = row.querySelector('.rowCheck');
                    const qtyInput = row.querySelector('.reqQty');
                    const productInput = row.querySelector('.productId');

                    checkbox.checked = true;
                    qtyInput.disabled = false;
                    productInput.disabled = false;
                    qtyInput.value = savedMap[productId].qty;
                }
            });

            Object.assign(selectedOutboundMap, savedMap);
        });

        function submitOutbound(){
            const rows = document.querySelectorAll('#outboundForm table tr');
            let checkedRows = [];

            for(const tr of rows){
                const checkbox = tr.querySelector('.rowCheck');
                if(!checkbox) continue;

                const productInput = tr.querySelector('.productId');
                const qtyInput = tr.querySelector('.reqQty');

                productInput.removeAttribute('name');
                qtyInput.removeAttribute('name');

                if(!checkbox.checked){
                    productInput.disabled = true;
                    qtyInput.disabled = true;
                    qtyInput.value = '';
                    continue;
                }

                const stockQty = Number(tr.querySelector('.stockQty').innerText);
                const reqQty = Number(qtyInput.value);

                if(!reqQty || reqQty <= 0){
                    alert('출고 요청 수량을 입력해주세요.');
                    qtyInput.focus();
                    return;
                }

                if(reqQty > stockQty){
                    alert(`출고 요청 수량(${reqQty})이 재고 수량(${stockQty})을 초과했습니다.`);
                    qtyInput.focus();
                    return;
                }

                checkedRows.push(tr);
            }

            if(checkedRows.length === 0){
                alert('출고할 상품을 선택하세요.');
                return;
            }

            // ✅ 2단계: 체크된 것만 index 재부여
            checkedRows.forEach((tr, idx) => {
                const productInput = tr.querySelector('.productId');
                const qtyInput = tr.querySelector('.reqQty');

                productInput.disabled = false;
                qtyInput.disabled = false;

                productInput.name = `outbound_reqDtos[${idx}].product_id`;
                qtyInput.name = `outbound_reqDtos[${idx}].quantity`;
            });

            if(!confirm('출고 요청 하시겠습니까?')) return;

            const form = document.getElementById('outboundForm');
            const formData = new FormData(form);

            fetch(form.action, {
                method: 'POST',
                body: formData
            })
                .then(resp => resp.json())
                .then(data => {
                    if(data.result==='success'){
                        alert("출고 요청이 완료되었습니다.");
                    }
                    else{
                        alert("출고 요청 중 오류가 발생했습니다.");
                    }
                    location.reload();
                })
                .catch(err => {
                    console.error(err);
                    alert('출고 요청 중 오류가 발생했습니다.');
                });

        }
        document.getElementById('resetOutboundSelection').addEventListener('click', () => {
            document.querySelectorAll('#outboundForm table tr').forEach(tr => {
                const checkbox = tr.querySelector('.rowCheck');
                const qtyInput = tr.querySelector('.reqQty');
                const productInput = tr.querySelector('.productId');

                if(checkbox){
                    checkbox.checked = false;
                    qtyInput.value = '';
                    qtyInput.disabled = true;
                    productInput.disabled = true;
                }
            });

            Object.keys(selectedOutboundMap).forEach(id => delete selectedOutboundMap[id]);
            sessionStorage.removeItem('selectedOutboundMap');
        });


    </script>
</section>
