<section xmlns:th="http://www.thymeleaf.org"
         th:fragment="content">
    <link rel="stylesheet" th:href="@{/css/content/webuserlist.css}">
    <div class="main">
        <div class="btn-group">

            <div class="main-title">계정 관리</div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span id="span2" style="color: red;font-size: 11px;"></span>
                <button onclick="insertWebuser()">계정 추가</button>
                <!-- 숨긴 파일 input -->
                <input type="file" id="fileInput" accept=".csv,.xlsx" style="display: none;">

                <!-- 사용자에게 보여줄 버튼 -->
                <button type="button" onclick="triggerFile()">엑셀로 추가하기</button>
            </div>
        </div>
        <form th:action="@{/webuser/insert}" method="post" style="display: none;" id="insertForm">
            <table>
                <tr>
                    <th>ID</th>
                    <td>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <input type="text" name="id" id="id">
                            <button type="button" onclick="idcheck()" class="check-btn">중복 체크</button>
                            <span id="span" style="color: red;font-size: 11px; white-space: nowrap;"></span>
                        </div>
                    </td>
                </tr>
                <tr>
                    <th>PASSWORD</th><td><input type="password" name="password"></td>
                </tr>
                <tr>
                    <th>이름</th><td><input type="text"
                                          name="webuser_name">
                </td>
                </tr>
                <tr>
                    <th>역할</th>
                    <td>
                        <label><input type="radio" name="role_id"
                               value="1">관리자</label>
                        <label><input type="radio" name="role_id"
                               value="2">사무 직원</label>
                        <label><input type="radio" name="role_id"
                               value="3">현장 직원</label>
                    </td>
                </tr>
                <tr>
                    <th colspan="2">
                        <div class="button-container">
                            <button type="button" onclick="no()" class="btn-cancel">취소</button>
                            <input type="submit" value="확인" class="btn-confirm">
                        </div>
                    </th>
                </tr>
            </table>
        </form>
        <div class="search-container">
            <form class="search-bar" onsubmit="return false;">
                <div class="filter-group">
                    <button type="button" onclick="filterStatus('all')" th:classappend="${field == 'all' || field== null} ? 'active' : ''">전체</button>
                    <button type="button" onclick="filterStatus('Y')" th:classappend="${field == 'Y'} ? 'active' : ''">활성</button>
                    <button type="button" onclick="filterStatus('N')" th:classappend="${field == 'N'} ? 'active' : ''">비활성</button>
                </div>

                <input type="hidden" name="field" id="formField" th:value="${field != null ? field : 'all'}">
                <input type="text" name="keyword" id="formKeyword" th:value="${keyword}"
                       placeholder="검색어를 입력하세요.">
            </form>
        </div>
        <div id="webuserListContainer">
            <table id="webuserTable">
                <thead>
                    <tr>
                        <th>사원 번호</th><th>이름</th><th>아이디</th>
                        <th>역할</th><th>가입일</th><th>상태</th>
                        <th>수정</th><th>근무 기록</th>
                    </tr>
                </thead>
                <tbody th:each="webuser:${list}">
                    <tr>
                        <td th:text="${webuser.webuser_id}"></td>
                        <td th:text="${webuser.webuser_name}"></td>
                        <td th:text="${webuser.id}"></td>
                        <td th:switch="${webuser.role_id}">
                            <label><span th:case="1">관리자</span></label>
                            <span th:case="2">사무 직원</span>
                            <span th:case="3">현장 직원</span>
                        </td>
                        <td th:text="${#temporals.format(webuser.created_at, 'yy-MM-dd')}"></td>
                        <td th:text="${webuser.is_active == 'Y' ? '활성':'비활성'}"></td>
                        <td><button type="button" onclick="updateForm(this)" class="btn-edit">수정</button></td>
                        <td><button type="button" class="btn-edit"
                                    th:attr="data-user-id=${webuser.webuser_id}"
                                    onclick="goCalender(this)">근무 기록</button>
                        </td>
                </tr>
                <tr class="updateTr" style="display: none;">
                    <td colspan="8">
                        <form th:action="@{/webuser/update}" method="post">
                            <table>
                                <tr>
                                    <th>사원 번호</th><td><input type="text"
                                                             name="webuser_id"
                                                             th:value="${webuser.webuser_id}" readonly></td>
                                </tr>
                                <tr>
                                    <th>ID</th><td><input type="text" name="id"
                                                          th:value="${webuser.id}"></td>
                                </tr>
                                <tr>
                                    <th>PASSWORD</th>
                                    <td>
                                        <div class="password-wrapper">
                                            <input type="password" name="password" th:value="${webuser.password}">
                                            <button type="button" class="btn-view" onclick="toggleVisibility(this)">
                                                <span class="eye-con">👁️</span>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <th>이름</th><td><input type="text"
                                                          name="webuser_name" th:value="${webuser.webuser_name}"></td>
                                </tr>
                                <tr>
                                    <th>역할</th>
                                    <td>
                                        <label><input type="radio" name="role_id"
                                               value="1" th:checked="${webuser.role_id == 1}">관리자</label>
                                        <label><input type="radio" name="role_id"
                                               value="2" th:checked="${webuser.role_id == 2}">사무 직원</label>
                                        <label><input type="radio" name="role_id"
                                               value="3" th:checked="${webuser.role_id == 3}">현장 직원</label>
                                    </td>
                                </tr>
                                <tr>
                                    <th>상태</th>
                                    <td>
                                        <label><input type="radio" name="is_active" value="Y" th:checked="${webuser.is_active == 'Y'}">활성</label>
                                        <label><input type="radio" name="is_active" value="N" th:checked="${webuser.is_active == 'N'}">비활성</label>
                                    </td>
                                </tr>
                                <tr>
                                    <th colspan="2">
                                        <input type="submit" value="확인">
                                    </th>
                                </tr>
                            </table>
                        </form>
                    </td>

                </tr>
                </tbody>
            </table>
            <div class="pagination-container">
                <ul class="page-ul" th:if="${pageInfo != null and pageInfo.totalPageCount > 1}">
                    <li th:if="${pageInfo.startPageNum > 1}">
                        <a href="javascript:void(0);" th:onclick="|updateWebuserList(${pageInfo.startPageNum -1}, true)|">[이전]</a>
                    </li>
                    <li th:each="num:${#numbers.sequence(pageInfo.startPageNum,pageInfo.endPageNum)}">
                        <a href="javascript:void(0);" th:onclick="|updateWebuserList(${num}, true)|">[[${num}]]</a>
                    </li>
                    <li th:if="${pageInfo.endPageNum < pageInfo.totalPageCount}">
                        <a href="javascript:void(0);" th:onclick="|updateWebuserList(${pageInfo.endPageNum +1}, true)|">[다음]</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
<script th:inline="javascript">
    function insertWebuser(){
        document.getElementById("insertForm").style.display="block";
    }

    function no(){
        document.getElementById("insertForm").style.display="none";
    }

    function idcheck(){
        const id=document.getElementById("id").value;
        const span=document.getElementById("span");

        fetch(`/webuser/idcheck?id=${id}`)
            .then(resp=>resp.text())
            .then(data=>{
                span.innerHTML=data;
            })
    }

    function updateForm(btn){
        const row = btn.closest("tr");               // 수정 버튼이 있는 원래 row
        const updateRow = row.nextElementSibling;    // 바로 다음 tr (수정 폼 tr)

        // 안전장치: 다음 행이 updateTr인지 확인
        if(!updateRow || !updateRow.classList.contains("updateTr")) return;

        // 다른 updateTr은 전부 닫고(원하면)
        document.querySelectorAll(".updateTr").forEach(tr => {
            if(tr !== updateRow) tr.style.display = "none";
        });

        // 토글
        updateRow.style.display = (updateRow.style.display === "none") ? "table-row" : "none";
    }

    let status = /*[[${status}]]*/ null;
    let msg = /*[[${msg}]]*/ null;

    if (status && msg) {
        alert(msg);
    }

    function triggerFile() {
        document.getElementById('fileInput').click(); // 파일 선택 창 열기
    }

    document.getElementById('fileInput').addEventListener('change', function() {
        const file = this.files[0];
        const span = document.getElementById('span2');

        if (!file) {
            span.textContent = "파일을 선택해주세요!";
            return;
        }

        const formData = new FormData();
        formData.append("file", file);

        fetch("/webuser/insert/excel", {
            method: "POST",
            body: formData
        })
            .then(response => {
                if (!response.ok) throw new Error("업로드 실패");
                return response.json();
            })
            .then(data => {
                span.style.color = "green";
                span.textContent = `계정 ${data.length}개 등록 완료!`;
            })
            .catch(error => {
                span.style.color = "red";
                span.textContent = "업로드 중 오류 발생: " + error.message;
            });
    });

    function toggleVisibility(btn){
        const input= btn.parentElement.querySelector('input');
        const icon= btn.querySelector('.eye-con');
        if(input.type === "password"){
            input.type = "text";
            icon.textContent= "🧑‍🦯‍➡️";
        }else{
            input.type= "password";
            icon.textContent= "👁️";
        }
    }
    function goCalender(btn){
        const targetUserId=btn.dataset.userId;
        const returnUrl=window.location.pathname + window.location.search;
        location.href = "/work/calendar?targetUserId=" + encodeURIComponent(targetUserId) +
            "&returnUrl=" + encodeURIComponent(returnUrl);
    }

    let debounceTimer;
    function updateWebuserList(pageNum =1, isAjax= false) {
        const field= document.getElementById("formField").value;
        const keyword= document.getElementById("formKeyword").value;
        const url=`/webuser/list?pageNum=${pageNum}&field=${field}&keyword=${keyword}`;

        if(isAjax){
            fetch(url)
                .then(response => response.text())
                .then(html => {
                    const parser= new DOMParser();
                    const doc= parser.parseFromString(html, 'text/html');
                    const newContent=doc.getElementById("webuserListContainer");
                    if(newContent){
                        document.getElementById("webuserListContainer").innerHTML= newContent.innerHTML;
                        window.history.pushState({}, '', url);
                    }
                })
                .catch(error => console.error("Search Error:", error));
        } else {
            location.href= url;
        }
    }

    function filterStatus(val){
        document.getElementById("formField").value= val;
        const buttons=document.querySelectorAll(".filter-group button");
        buttons.forEach(btn => btn.classList.remove('active'));

        const clickedBtn= event.currentTarget;
        if(clickedBtn) clickedBtn.classList.add('active');
        updateWebuserList(1, true);
    }

    document.getElementById("formKeyword").addEventListener("keyup", function() {
        clearTimeout(debounceTimer);
        debounceTimer= setTimeout(()=>{
            updateWebuserList(1, true);
        }, 300);
    });


</script>
</section>
