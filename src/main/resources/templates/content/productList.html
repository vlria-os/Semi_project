<!-- content/productList.html -->
<section xmlns:th="http://www.thymeleaf.org"
         th:fragment="content">
    <link rel="stylesheet" th:href="@{/css/content/productlist.css}">
<div class="main">
    <div class="header-area">
        <h2>상품 목록</h2>
        <div th:class="btn" style="display: flex; gap: 5px;">
            <a th:href="@{/content/product_insert}" class="btn-insert">상품등록</a>
            <a th:href="@{/content/category_insert}" class="btn-insert">카테고리등록</a>
        </div>
    </div>

    <div class="filter-container">
        <div class="filter">
            <input type="text" id="keyword" placeholder="상품명, 카테고리명 또는 아이디 검색" th:value="${searchDto.keyword}">
            <button name="field" type="button" value="all" th:classappend="${searchDto.field=='all' or searchDto.field == null or searchDto == ''} ?  'active' : '' ">전체</button>
            <button name="field" type="button" value="COLD" th:classappend="${searchDto.field=='cold'} ?  'active' : '' ">냉장</button>
            <button name="field" type="button" value="FROZEN" th:classappend="${searchDto.field=='frozen'} ?  'active' : '' ">냉동</button>
            <button name="field" type="button" value="ROOM" th:classappend="${searchDto.field=='room'} ?  'active' : '' ">상온</button>
        </div>
    </div>

    <div id="listContainer">
    <table id="Table">
        <thead>
        <tr>
            <th>상품번호</th>
            <th>이미지</th>
            <th>상품명</th>
            <th>단위</th>
            <th>가격</th>
            <th>분류</th>
            <th>카테고리</th>
        </tr>
        </thead>

        <tbody id="productBody">
        <tr th:each="l : ${list}" th:onclick="|location.href='@{/content/product_update(product_id=${l.product_id})}'|" style="cursor: pointer;">
                <td th:text="${l.product_id}"></td>
                <td>
                    <img th:src="@{'/image/' + ${l.save_name}}" style="width:50px; height:50px; border-radius: 4px; object-fit: cover;">
                </td>
                <td th:text="${l.product_name}" style="font-weight: 600;"></td>
                <td th:text="${l.unit}"></td>
                <td th:text="${#numbers.formatDecimal(l.price, 0, 'COMMA', 0, 'POINT')} + '원'"></td>
                <td>
                    <span th:text="${l.status}" th:class="'status-badge ' + ${l.status}"></span>
                </td>
                <td th:text="${l.category}"></td>
        </tr>
        </tbody>
    </table>


    <div>
        <ul id="pagingArea" th:if="${pageInfo != null and pageInfo.totalPageCount > 1}">
            <li th:if="${pageInfo.startPageNum > 1}">
                <a th:href="@{/content/productList(pageNum=${pageInfo.startPageNum - 1}, field=${searchDto.field}, keyword=${searchDto.keyword})}">[이전]</a>
            </li>
            <li th:each="num:${#numbers.sequence(pageInfo.startPageNum,pageInfo.endPageNum)}">
                <a th:href="@{/content/productList(pageNum=${num},field=${searchDto.field}, keyword=${searchDto.keyword})}">[[${num}]]</a>
            </li>
            <li th:if="${pageInfo.endPageNum < pageInfo.totalPageCount}">
                <a th:href="@{/content/productList(pageNum=${pageInfo.endPageNum + 1}, field=${searchDto.field}, keyword=${searchDto.keyword})}">[다음]</a>
            </li>
        </ul>
    </div>
</div>
</div>
    <!-- 페이지 전용 스크립트 -->
    <script>
        document.addEventListener("DOMContentLoaded", function(){
            const keywordInput= document.getElementById("keyword");
            const filterButtons= document.querySelectorAll(".filter button");
            const listContainer= document.getElementById("listContainer");

            let currentField= "all";
            let debounceTimer;

            async function updateProductList(){
                const keyword= keywordInput.value;
                const url = `/content/productList?keyword=${encodeURIComponent(keyword)}&field=${currentField}&isAjax=true`;

                try{
                    listContainer.style.opacity="0.5";
                    const response= await fetch(url);
                    const html= await response.text();

                    const parser= new DOMParser();
                    const doc= parser.parseFromString(html, 'text/html');
                    const newContent= doc.getElementById("listContainer");

                    if(newContent){
                        listContainer.innerHTML= newContent.innerHTML;
                    }
                } catch (error){
                    console.error("Search failed:", error);
                }finally{
                    listContainer.style.opacity="1";
                }
            }

            keywordInput.addEventListener("input", () => {
                clearTimeout(debounceTimer);
                debounceTimer=setTimeout(updateProductList, 300);
            });

            filterButtons.forEach(btn => {
                btn.addEventListener("click", (e) => {
                    e.preventDefault();
                    currentField= btn.value;

                    filterButtons.forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");

                    updateProductList();
                });
            });
        });
