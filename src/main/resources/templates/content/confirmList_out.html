<!-- content/productList.html -->
<section xmlns:th="http://www.thymeleaf.org"
         th:fragment="content">
    <div class="main">
        <button><a th:href="@{/content/confirmList}">입고</a></button>
        <button><a th:href="@{/content/confirmList/out}">출고</a></button>
        <table>
            <tr>
                <th>번호</th><th>폐기여부</th><th>상태</th><th>요청일</th>
            </tr>
            <tr th:each="l:${list}" onclick="showDetail(this)">
                <td th:text="${l.outbound_id}"></td>
                <td th:text="${l.is_expired}"></td>
                <td th:text="${l.outbound_status}"></td>
                <td th:text="${l.request_date}"></td>
            </tr>
        </table>
    </div>

    <script>
        function showDetail(btn){
            const currentTr=btn.closest("tr");
            const colCount = currentTr.children.length;

            // 이미 상세 row 있으면 토글
            if(currentTr.nextElementSibling &&
                currentTr.nextElementSibling.classList.contains("detailRow")){
                currentTr.nextElementSibling.remove();
                return;
            }
            const bound_id=currentTr.children[0].innerText.trim();

            fetch(`/confirm/detail_out?outbound_id=${bound_id}`)
                .then(resp=>resp.json())
                .then(data=>{
                    console.log(data);
                    const tr = document.createElement("tr");
                    tr.className = "detailRow";

                    let rows = "";
                    data.forEach(l=>{
                        let reasonBtn="";
                        if(l.outbound_status == 'REJECTED'){
                            reasonBtn = `
                                      <button onclick="showReason('IN',${l.lot_out_id},
                                      this)">사유 보기</button>
                                    `;
                        }
                        rows += `
                  <tr>
                    <td>${l.outbound_status}</td>
                    <td>${l.product_name}</td>
                    <td>${l.warehouse_name}</td>
                    <td>${l.shipped_date}</td>
                    <td>${l.quantity}</td>
                    <td>
                        ${reasonBtn}
                    </td>
                    <td>
                        <button onclick="refund(${l.lot_out_id})">반품</button>
                    </td>
                  </tr>
                `;
                    });

                    tr.innerHTML=`
                  <td colspan="${colCount}">
                     <table>
                     <tr>
                        <th>상태</th><th>상품명</th><th>창고명</th><th>출고일</th><th>수량</th>
                     </tr>
                     ${rows}
                     </table>
                  </td>
                  `;
                    currentTr.after(tr);
                });
        };

        function refund(lot_out_id){
            fetch(`/office_staff/refund?lot_out_id=${lot_out_id}`)
                .then(resp=>resp.json())
                .then(data=>{
                    if(data.success){
                        alert("환불 요청 완료");
                        location.reload(); // or 목록 다시 조회
                    }else{
                        alert(("이미 환불된 항목입니다."));
                    }
                })
        }
    </script>
</section>
