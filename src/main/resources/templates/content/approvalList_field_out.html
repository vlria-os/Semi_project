<section xmlns:th="http://www.thymeleaf.org"
         th:fragment="content">
  <div class="main">
    <div>
      <button onclick="goInConf()">입고</button> <button onclick="goOutConf()">출고</button>
    </div>
    <table>
      <tr>
        <th>승인 번호</th><th>승인자</th><th>상품명</th><th>승인일</th>
      </tr>
      <tr th:each="l:${list}" th:attr="data-outbound-id=${l.outbound_id}" onclick="showDetail(this)">
        <td th:text="${l.approval_id}"></td>
        <td th:text="${l.approver_name}"></td>
        <td th:text="${l.product_name}"></td>
        <td th:text="${#temporals.format(l.created_at, 'yyyy-MM-dd HH:mm:ss')}"></td>
      </tr>
    </table>
  </div>
  <script>
    function goInConf(){
      location.href="/field_staff/inbound_conf";
    }

    function goOutConf(){
      location.href="/field_staff/outbound_conf";
    }

    function showDetail(btn){
      const currentTr=btn.closest("tr");
      const colCount = currentTr.children.length;

      // 이미 상세 row 있으면 토글
      if(currentTr.nextElementSibling &&
              currentTr.nextElementSibling.classList.contains("detailRow")){
        currentTr.nextElementSibling.remove();
        return;
      }

      const bound_type="OUT";
      const bound_id=currentTr.dataset.outboundId;

      fetch(`/field_staff/bound_conf/detailList?bound_type=${bound_type}&bound_id=${bound_id}`)
              .then(resp=>resp.json())
              .then(data=>{
                const tr = document.createElement("tr");
                tr.className = "detailRow";
                let rows = "";

                const list=data.list;
                const names=data.names;

                list.forEach(l=>{
                  if (bound_type === 'IN') {
                    const name=names[String(l.inbound_detail_id)];

                    rows += `
    <tr class="detailItem"
      data-bound-detail-id="${bound_type == 'IN' ? l.inbound_detail_id : l.outbound_detail_id}" data-bound-type="${bound_type}">
      <td data-product-id="${l.product_id}">${name}</td>
      <td class="originQty">${l.quantity}</td>
      <td>${bound_type == 'IN' ? l.inbound_status : l.outbound_status}</td>
      <td>
        <div class="lotBox">
          <div class="lotRow">
            <input type="date" class="expireDate">
            <input type="number" class="lotQty" min="1" placeholder="수량">
          </div>
        </div>
        <button type="button" onclick="addLotRow(event, this)">+</button>
      </td>
      <td>
        <button type="button"
                onclick="confirmApprove(event,this)">승인</button>
        <button type="button"
                onclick="showRejectBox(event,this)">반려</button>
      </td>
    </tr>
  `;
                  }

                  else{
                    const name=names[String(l.outbound_detail_id)];

                    rows += `
      <tr class="detailItem"
          data-bound-detail-id="${l.outbound_detail_id}"
          data-bound-type="OUT">
        <td data-product-id="${l.product_id}">${name}</td>
        <td>${l.quantity}</td>
        <td>${l.outbound_status}</td>
        <td>—</td>
        <td>
          <button type="button"
                  onclick="confirmApprove(event,this)">승인</button>
          <button type="button"
                  onclick="showRejectBox(event,this)">반려</button>
        </td>
      </tr>
    `;
                  }
                });


                tr.innerHTML=`
                  <td colspan="${colCount}">
                     <table>
                     <tr>
                        <th>상품명</th><th>수량</th><th>승인 상태</th><th>수량</th><th>처리</th>
                     </tr>
                     ${rows}
                     </table>
                  </td>
                  `;

                currentTr.after(tr);
              });
    }


    function showRejectBox(e, btn) {
      e.stopPropagation();

      const detailTr = btn.closest('tr');

      // 이미 반려 박스가 있으면 토글
      if (detailTr.nextElementSibling &&
              detailTr.nextElementSibling.classList.contains('rejectRow')) {
        detailTr.nextElementSibling.remove();
        return;
      }

      // 다른 열려 있는 반려 박스 닫기
      document.querySelectorAll('.rejectRow').forEach(r => r.remove());

      const colCount = detailTr.children.length;

      const rejectTr = document.createElement('tr');
      rejectTr.className = 'rejectRow';

      rejectTr.innerHTML = `
    <td colspan="${colCount}">
      <textarea class="rejectReason" rows="3" style="width: 90%;"></textarea>
      <br/>
      <button onclick="submitReject(event, this)">확인</button>
      <button onclick="cancelReject(event, this)">취소</button>
    </td>
  `;

      detailTr.after(rejectTr);
    }


    function addLotRow(e, btn) {
      e.stopPropagation();

      const detailTr = btn.closest('.detailItem');
      const lotBox = detailTr.querySelector('.lotBox');
      const originQty = Number(detailTr.querySelector('.originQty').innerText);

      // 현재 입력된 수량 합계
      let sum = 0;
      lotBox.querySelectorAll('.lotQty').forEach(i => {
        sum += Number(i.value || 0);
      });

      if (sum >= originQty) {
        alert('총 수량을 초과할 수 없습니다.');
        return;
      }

      const row = document.createElement('div');
      row.className = 'lotRow';
      row.innerHTML = `
    <input type="date" class="expireDate">
    <input type="number"
       class="lotQty"
       min="1"
       placeholder="수량"
       oninput="validateLotQty(this)">
    <button type="button" onclick="removeLotRow(this)">-</button>
  `;

      lotBox.appendChild(row);
    }

    function removeLotRow(btn){
      event.stopPropagation();
      btn.closest('.lotRow').remove();
    }

    function validateLotQty(input){
      const detailTr = input.closest('.detailItem');
      const originQty = Number(detailTr.querySelector('.originQty').innerText);

      let sum = 0;
      detailTr.querySelectorAll('.lotQty').forEach(i=>{
        sum += Number(i.value || 0);
      });

      if(sum > originQty){
        alert('총 수량을 초과할 수 없습니다.');
        input.value = '';
      }
    }

    function confirmApprove(e, btn){
      e.stopPropagation();

      if(!confirm('승인하시겠습니까?')) return;

      submitApprove(e, btn);
    }

    function submitApprove(e, btn){
      e.stopPropagation();

      const detailTr = btn.closest('.detailItem');
      const lotRows = detailTr.querySelectorAll('.lotRow');
      const boundType = detailTr.dataset.boundType;
      const boundDetailId = detailTr.dataset.boundDetailId; // "IN" | "OUT" // "IN" or "OUT"

      const form = document.createElement('form');
      form.method = 'post';

      if(boundType === 'OUT'){
        form.action = '/field_staff/outbound_conf_app';

        form.appendChild(hidden('outbound_detail_id', boundDetailId));
        form.appendChild(hidden('product_id', detailTr.children[0].dataset.productId));
        form.appendChild(hidden('quantity', detailTr.children[1].innerText));

        document.body.appendChild(form);
        form.submit();
        return;
      }

      if(lotRows.length === 0){
        alert('유통기한과 수량을 입력해주세요.');
        return;
      }

      if(!boundDetailId || !boundType){
        alert('상세 정보가 없습니다.');
        return;
      }

      // 🔹 form 생성
      form.method = 'post';
      form.action = '/field_staff/inbound_conf_app';

      let idx = 0;

      lotRows.forEach(row => {
        const expireDate = row.querySelector('.expireDate').value;
        const qty = row.querySelector('.lotQty').value;

        if(!expireDate || !qty) return;

        form.appendChild(hidden(`lot_inDtos[${idx}].expiration_date`, expireDate));
        form.appendChild(hidden(`lot_inDtos[${idx}].quantity`, qty));
        form.appendChild(hidden(`lot_inDtos[${idx}].product_id`,
                detailTr.children[0].dataset.productId));

        // 🔥 핵심: IN/OUT 공통 상세 ID + 타입
        const isIn = boundType === 'IN'; // 너가 쓰는 값에 맞춰

        const detailFieldName = isIn
                ? `lot_inDtos[${idx}].inbound_detail_id`
                : `lot_inDtos[${idx}].outbound_detail_id`;

        form.appendChild(hidden(detailFieldName, boundDetailId));
        form.appendChild(hidden(`lot_inDtos[${idx}].bound_type`, boundType));

        idx++;
      });

      if(idx === 0){
        alert('입력값이 없습니다.');
        return;
      }

      document.body.appendChild(form);
      form.submit();
    }

    function hidden(name, value){
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = name;
      input.value = value;
      return input;
    }

    function submitReject(e, btn){
      e.stopPropagation();

      const rejectTr = btn.closest('.rejectRow');
      const detailTr = rejectTr.previousElementSibling;
      const reason = rejectTr.querySelector('.rejectReason').value;

      if(!reason){
        alert('반려 사유를 입력하세요.');
        return;
      }

      const boundDetailId = detailTr.dataset.boundDetailId;
      const boundType = detailTr.dataset.boundType;

      const form = document.createElement('form');
      form.method = 'post';

      form.appendChild(hidden('reason', reason));

      // 🔥 핵심: List 바인딩 가능하게
      form.appendChild(hidden('product_id',
              detailTr.children[0].dataset.productId));

      if(boundType === 'IN'){
        form.action = '/field_staff/inbound_conf_rej';
        form.appendChild(hidden(
                'inbound_detail_id',
                boundDetailId
        ));
      }else{
        form.action = '/field_staff/outbound_conf_rej';
        form.appendChild(hidden(
                'outbound_detail_id',
                boundDetailId
        ));
      }

      form.appendChild(hidden('bound_type', boundType));

      console.log('boundDetailId=', boundDetailId);
      console.log('boundType=', boundType);

      document.body.appendChild(form);
      form.submit();
    }

  </script>
</section>
