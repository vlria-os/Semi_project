<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>근무 캘린더</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.css">
    <link rel="stylesheet" th:href="@{/css/calendar.css}">
</head>
<body>
<div class="main">

    <div class="calendar-owner">
        <span class="label">근무 기록</span>
        <span class="value" th:text="${viewUserName} + ' (사원 번호: ' + ${viewUserId} + ')'">
        홍길동 (사번: 3)
    </span>
    </div>

    <div id="calendar"></div>

    <!-- ✅ 클릭한 이벤트 옆에 뜨는 작은 팝오버 -->
    <div id="workPopover" class="work-popover hidden">
        <div class="pop-header">
            <div class="pop-date" id="popDate">2026-01-21</div>
            <button class="pop-close" type="button" id="popCloseBtn">×</button>
        </div>

        <div class="pop-body">
            <div class="pop-row">
                <span class="k">상태</span>
                <span class="v" id="popStatus">정상 근무</span>
            </div>

            <div class="pop-row">
                <span class="k">출근</span>
                <span class="v" id="popCheckIn">10:34</span>
            </div>

            <div class="pop-row">
                <span class="k">퇴근</span>
                <span class="v" id="popCheckOut">18:02</span>
            </div>

            <div class="pop-row memo">
                <span class="k">메모</span>
                <div class="memo-box" id="popMemo">배고파</div>
            </div>

            <div class="pop-row hidden" id="lateCheckoutRow">
                <span class="k">퇴근 보정</span>
                <div class="v" style="display:flex; gap:8px; align-items:center;">
                    <input type="time" id="lateCheckoutTime" value="18:00">
                    <button type="button" id="lateCheckoutBtn">퇴근 보정</button>
                </div>
            </div>

            <div class="pop-row hidden" id="lateCheckoutMsgRow">
                <span class="k"></span>
                <span class="v" id="lateCheckoutMsg" style="white-space:nowrap;"></span>
            </div>

            <div class="pop-row hidden" id="absentEditRow" style="display:block;">

                <!-- 제목: pop-row/k 구조 완전 탈출 -->
                <div style="font-weight:600; margin-bottom:6px; color:#444;">
                    결근 수정
                </div>

                <!-- 내용 -->
                <div style="display:flex; flex-direction:column; gap:8px;">

                    <select id="absentStatus" style="width:100%;">
                        <option value="WORK">정상 근무</option>
                        <option value="ANNUAL">연차</option>
                        <option value="SICK">병가</option>
                        <option value="HALF_AM">오전 반차</option>
                        <option value="HALF_PM">오후 반차</option>
                        <option value="ETC">기타</option>
                    </select>

                    <div style="display:flex; gap:8px;">
                        <input type="time" id="absentIn" value="09:00" style="flex:1;">
                        <input type="time" id="absentOut" value="18:00" style="flex:1;">
                    </div>

                    <button type="button" id="absentSaveBtn">결근 수정</button>
                </div>
            </div>


            <div class="pop-row hidden" id="absentMsgRow">
                <span class="k"></span>
                <span class="v" id="absentMsg" style="white-space:nowrap;"></span>
            </div>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.js"></script>
<script th:inline="javascript">
    const role_id = /*[[${session.role_id}]]*/ 0;
    const IS_ADMIN=(role_id === 1);
    console.log('IS_ADMIN=', IS_ADMIN);

    const statusTextMap = {
        WORK: '정상 근무',
        CHECK_IN_ONLY: '출근 (퇴근 미등록)',
        HALF_AM: '오전 반차',
        HALF_PM: '오후 반차',
        ANNUAL: '연차',
        SICK: '병가',
        CHECK_OUT_LATE: '익일 퇴근 처리',
        ABSENT: '결근',
        ETC: '기타'
    };

    function openPopoverAt(element) {
        const pop = document.getElementById('workPopover');

        // ✅ 일단 보이게 해서 크기 계산 가능하게
        pop.classList.remove('hidden');

        const rect = element.getBoundingClientRect();
        const popRect = pop.getBoundingClientRect();

        // 기본 위치: 이벤트 오른쪽
        let top = window.scrollY + rect.top;
        let left = window.scrollX + rect.right + 10;

        // 화면 밖으로 나가면 왼쪽으로
        if (left + popRect.width > window.scrollX + window.innerWidth - 8) {
            left = window.scrollX + rect.left - popRect.width - 10;
        }

        // 그래도 왼쪽이 너무 작으면, 아래로 내림
        if (left < 8) {
            left = window.scrollX + rect.left;
            top = window.scrollY + rect.bottom + 10;
        }

        // 아래로 벗어나면 위로 올림
        if (top + popRect.height > window.scrollY + window.innerHeight - 8) {
            top = window.scrollY + window.innerHeight - popRect.height - 8;
        }

        pop.style.top = top + 'px';
        pop.style.left = left + 'px';
    }

    function closePopover() {
        const pop = document.getElementById('workPopover');
        pop.classList.add('hidden');
    }

    document.addEventListener("DOMContentLoaded", function () {
        // ✅ URL에서 targetUserId 뽑기 (/work/calendar?targetUserId=123)
        const qs = new URLSearchParams(window.location.search);
        const targetUserId = qs.get('targetUserId'); // 없으면 null
        console.log('targetUserId:', targetUserId);


        const calendarEl = document.getElementById("calendar");
        const pop = document.getElementById('workPopover');

        let currentEvent = null;

        // 닫기 버튼
        document.getElementById('popCloseBtn').addEventListener('click', closePopover);

        // 바깥 클릭하면 닫기
        document.addEventListener('click', (e) => {
            if (pop.classList.contains('hidden')) return;
            const clickedInsidePopover = pop.contains(e.target);
            const clickedOnEvent = e.target.closest('.fc-event');
            if (!clickedInsidePopover && !clickedOnEvent) closePopover();
        });

        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            height: 'auto',

            events: function (fetchInfo, successCallback, failureCallback) {
                const params = new URLSearchParams({
                    startDate: fetchInfo.startStr.slice(0, 10),
                    endDate: fetchInfo.endStr.slice(0, 10)
                });

                // ✅ 관리자 페이지로 들어온 경우만 targetUserId 같이 넘김
                if (targetUserId) {
                    params.set('targetUserId', targetUserId);
                }

                fetch('/api/work/calendar?' + params.toString())
                    .then(resp => {
                        if (!resp.ok) throw new Error('events load fail: ' + resp.status);
                        return resp.json();
                    })
                    .then(data => successCallback(data))
                    .catch(err => {
                        console.error(err);
                        failureCallback(err);
                    });
            },

            eventClick: function (info) {
                // ✅ 날짜칸 클릭(페이지 이동) 막기
                info.jsEvent.preventDefault();
                info.jsEvent.stopPropagation();

                const e = info.event;
                const p = e.extendedProps;

                // 팝오버 값 채우기
                document.getElementById('popDate').textContent = e.startStr;

                const statusCode = p.attendStatus;
                document.getElementById('popStatus').textContent =
                    statusTextMap[statusCode] || '기타';

                document.getElementById('popCheckIn').textContent = p.checkInTime ?? '-';
                document.getElementById('popCheckOut').textContent = p.checkOutTime ?? '-';
                document.getElementById('popMemo').textContent = p.memo ?? '';

                // 상태 글자 색을 이벤트 색으로 통일(예쁨)
                document.getElementById('popStatus').style.color =
                    e.backgroundColor || e.color || '#5F6368';

                //퇴근 보정 버튼
                currentEvent = e;

                // 보정 UI 토글
                const canFix =
                    p.canCheckoutLate === true ||
                    p.canCheckoutLate === 1 ||
                    p.canCheckoutLate === "1";

                console.log('canCheckoutLate:', p.canCheckoutLate, typeof p.canCheckoutLate);

                const lateRow = document.getElementById('lateCheckoutRow');
                const msgRow = document.getElementById('lateCheckoutMsgRow');
                const msg = document.getElementById('lateCheckoutMsg');

                msg.textContent = '';
                msgRow.classList.add('hidden');

                if (canFix) {
                    lateRow.classList.remove('hidden');

                    // 기본값: 18:00 (원하면 '현재시간'으로 바꿀 수도 있음)
                    document.getElementById('lateCheckoutTime').value = '18:00';
                } else {
                    lateRow.classList.add('hidden');
                }

                const absentRow = document.getElementById('absentEditRow');
                const absentMsgRow = document.getElementById('absentMsgRow');
                const absentMsg = document.getElementById('absentMsg');

                absentMsg.textContent = '';
                absentMsgRow.classList.add('hidden');

                const isAbsent = (p.attendStatus === 'ABSENT');

                if (IS_ADMIN && isAbsent) {
                    absentRow.classList.remove('hidden');

                    // 기본값
                    document.getElementById('absentStatus').value = 'WORK';
                    document.getElementById('absentIn').value = '09:00';
                    document.getElementById('absentOut').value = '18:00';
                } else {
                    absentRow.classList.add('hidden');
                }

                // ✅ 클릭한 “이벤트 DOM” 옆에 띄우기
                openPopoverAt(info.el);
                toggleAbsentTimeInputs();
            }
        });

        document.getElementById("lateCheckoutBtn").addEventListener("click", async () => {
            if (!currentEvent) return;

            const workingLogId = currentEvent.id;
            const checkOutTime = document.getElementById("lateCheckoutTime").value;

            const msgRow = document.getElementById('lateCheckoutMsgRow');
            const msg = document.getElementById('lateCheckoutMsg');
            msgRow.classList.remove('hidden');
            msg.textContent = '처리 중...';

            try {
                const resp = await fetch(`/api/work/${workingLogId}/checkout-late`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ checkOutTime })
                });

                let result = {};
                try { result = await resp.json(); } catch (e) { result = {}; }

                if (!resp.ok) {
                    msg.textContent = result?.message || '실패';
                    return;
                }

                currentEvent.setProp('title','익일 퇴근 처리');
                currentEvent.setProp('backgroundColor', '#000000');
                currentEvent.setProp('borderColor', '#000000');

                currentEvent.setExtendedProp('attendStatus','CHECK_OUT_LATE');
                currentEvent.setExtendedProp('checkOutTime', checkOutTime);
                currentEvent.setExtendedProp('canCheckoutLate',false);

                document.getElementById("popStatus").innerText = "익일 퇴근 처리";
                document.getElementById("popStatus").style.color = "#000000";
                document.getElementById("popCheckOut").innerText = checkOutTime;

                document.getElementById("lateCheckoutRow").classList.add("hidden");

                msg.textContent = result.message || '퇴근 보정 성공!';
            } catch (err) {
                console.error(err);
                msgRow.classList.remove('hidden');
                msg.textContent = '요청 실패: ' + (err.message || '네트워크 오류');
            }
        });

        document.getElementById("absentSaveBtn").addEventListener("click", async () => {
            if (!currentEvent) return;

            const workingLogId=currentEvent.id;

            const attendStatus = document.getElementById("absentStatus").value;
            const checkInTime = document.getElementById("absentIn").value;   // "09:00"
            const checkOutTime = document.getElementById("absentOut").value; // "18:00"

            const msgRow = document.getElementById('absentMsgRow');
            const msg = document.getElementById('absentMsg');
            msgRow.classList.remove('hidden');
            msg.textContent = '처리 중...';

            try{
                const resp=await fetch(`/api/work/${workingLogId}/absent-update`,{
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({attendStatus, checkInTime, checkOutTime})
                });

                // const result=await resp.json().catch(() => ({}));
                const raw = await resp.text();
                console.log('status=', resp.status, 'raw=', raw);

                let result = {};
                try { result = JSON.parse(raw); } catch(e) {}

                if (!resp.ok){
                    msg.textContent = result?.message || raw || '실패';
                    return;
                }

                msg.textContent = result?.message || '결근 수정 성공!';
                closePopover();
                calendar.refetchEvents(); // 서버 기준으로 이벤트 다시 받는 게 제일 안전

            }catch (err){
                console.error(err);
                msg.textContent = '요청 실패: ' + (err.message || '네트워크 오류');
            }
        });

        document.getElementById('absentStatus').addEventListener('change', toggleAbsentTimeInputs);

        calendar.render();
    });

    function toggleAbsentTimeInputs() {
        const s = document.getElementById('absentStatus').value;
        const enabled = (s === 'WORK');
        document.getElementById('absentIn').disabled = !enabled;
        document.getElementById('absentOut').disabled = !enabled;
    }

    document.getElementById('absentStatus').addEventListener('change', toggleAbsentTimeInputs);

</script>
</body>
</html>
