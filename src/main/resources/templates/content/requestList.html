<!-- content/productList.html -->
<section xmlns:th="http://www.thymeleaf.org"
         th:fragment="content">
    <div class="main">
        <div th:if="${role_id == 1}">
            <button onclick="gomain()">전체</button> <button onclick="goinbound()">입고</button> <button onclick="gooutbound()">출고</button>
        </div>
        <div th:if="${role_id == 2}">
            <button onclick="gomain()">전체</button> <button onclick="goinbound2()">입고</button> <button onclick="gooutbound2()">출고</button>
        </div>
        <table th:if="${role_id == 1}" id="adminTable">
            <tr>
                <th>입출고</th><th>입출고 번호</th><th>요청자</th><th>승인 상태</th><th>요청일</th><th>상세보기</th>
            </tr>
            <tr th:each="l:${list}">
                <td th:text="${l.io_type}"></td><td th:text="${l.io_id}"></td><td th:text="${l.webuser_id}"></td>
                <td th:text="${l.approval_status}"></td><td th:text="${l.request_date}"></td>
                <td th:if="${l.io_type=='in'}"><button type="button" onclick="showInDetail(this)">상세보기</button></td>
                <td th:if="${l.io_type=='out'}"><button type="button" onclick="showOutDetail(this)">상세보기</button></td>
            </tr>
        </table>
        <table th:if="${role_id == 2}" id="userTable">
            <tr th:each="l:${list}">
                <td><p th:text="|${l.io_type} ${l.approval_status}|"></p>
                    <p th:text="|${l.request_date}|"></p>
                    <a th:if="${l.io_type=='in'}"
                       th:href="@{/request/user/inbound(inbound_id=${l.io_id})}">
                        상세보기
                    </a>

                    <a th:if="${l.io_type=='out'}"
                       th:href="@{/request/user/outbound(outbound_id=${l.io_id})}">
                        상세보기
                    </a>


                </td>
            </tr>
        </table>
        <div>
            <ul id="pagingArea">
                <li th:if="${pageInfo.startPageNum > 1}">
                    <a th:href="@{/layout(pageNum=${pageInfo.startPageNum - 1})}">이전</a>
                </li>
                <li th:each="num:${#numbers.sequence(pageInfo.startPageNum,pageInfo.endPageNum)}">
                    <a th:href="@{/layout(pageNum=${num})}">[[${num}]]</a>
                </li>
                <li th:if="${pageInfo.endPageNum < pageInfo.totalPageCount}">
                    <a th:href="@{/layout(pageNum=${pageInfo.endPageNum + 1})}">다음</a>
                </li>
            </ul>
        </div>
    </div>
<script th:inline="javascript">
    function logout(){
        fetch('/logout')
            .then(resp=>resp.text())
            .then(data=>{
                alert(data);
                location.href="/";
            })
    }

    function gomain(){
        location.href="/content/requsetList";
    }

    function goinbound(pageNum = 1){
        const table=document.getElementById("adminTable");
        const paging=document.getElementById("pagingArea");

        fetch(`/goinbound?pageNum=${pageNum}`)
            .then(resp=>resp.json())
            .then(data=>{

                const list=data.list;
                const pageInfo=data.pageInfo;

                //테이블 초기화
                table.innerHTML="";
                paging.innerHTML="";

                //목록 출력
                list.forEach(l=>{
                    table.innerHTML+=`
                                    <tr>
                                        <td>
                                            <p>${l.inbound_id} 요청자:${l.webuser_id} ${l.approval_status}</p>
                                            <p>${l.request_date}</p>
                                            <a href="/request/admin/inbound?inbound_id=${l.inbound_id}">상세보기</a>
                                        </td>
                                    </tr>
                                    `;
                });

                //이전 버튼
                if (pageInfo.startPageNum > 1) {
                    paging.innerHTML += `
                    <li>
                        <a href="javascript:goinbound(${pageInfo.startPageNum - 1})">이전</a>
                    </li>
                `;
                }

                //페이지 번호
                for (let i = pageInfo.startPageNum; i <= pageInfo.endPageNum; i++) {
                    paging.innerHTML += `
                    <li>
                        <a href="javascript:goinbound(${i})">${i}</a>
                    </li>
                `;
                }

                //다음 버튼
                if (pageInfo.endPageNum < pageInfo.totalPageCount) {
                    paging.innerHTML += `
                    <li>
                        <a href="javascript:goinbound(${pageInfo.endPageNum + 1})">다음</a>
                    </li>
                `;
                }
            })
    }

    if (status && msg) {

    function showInDetail(btn){
        const currentTr=btn.closest("tr");
        const colCount = currentTr.children.length;

        // 이미 상세 row 있으면 토글

            currentTr.nextElementSibling.classList.contains("detailRow")){
            currentTr.nextElementSibling.remove();
            return;
        }

        const bound_type=currentTr.children[0].innerText.trim();
        const bound_id=currentTr.children[1].innerText.trim();
