<section xmlns:th="http://www.thymeleaf.org"
         th:fragment="content">
    <link rel="stylesheet" th:href="@{/css/content/requestlist.css}">
    <div class="main">
        <button onclick="gomain()">전체</button> <button onclick="goinbound()">입고</button>
        <button onclick="gooutbound()">출고</button>
        <table id="Table">
            <tr>
                <th>입출고</th><th>입출고 번호</th><th>요청자</th><th>승인 상태</th><th>요청일</th><th>상세보기</th>
            </tr>
            <tr th:each="l:${list}">
                <td th:text="${l.io_type}"></td>
                <td th:text="${l.io_id}"></td>
                <td th:text="${l.webuser_id}"></td>
                <td th:text="${l.approval_status}"></td>
                <td th:text="${l.request_date}"></td>
                <td th:if="${l.io_type=='IN'}"><button type="button"
                                                       th:attr="data-io-id=${l.io_id}"
                                                       onclick="showInDetail(this)">상세보기</button></td>
                <td th:if="${l.io_type=='OUT'}"><button type="button"
                                                        th:attr="data-io-id=${l.io_id}"
                                                        onclick="showOutDetail(this)">상세보기</button>
            </tr>
        </table>
        <div>
            <ul id="pagingArea" th:if="${pageInfo != null and pageInfo.totalPageCount > 1}">
                <li th:if="${pageInfo.startPageNum > 1}">
                    <a th:href="@{/layout(pageNum=${pageInfo.startPageNum - 1})}">이전</a>
                </li>
                <li th:each="num:${#numbers.sequence(pageInfo.startPageNum,pageInfo.endPageNum)}">
                    <a th:href="@{/layout(pageNum=${num})}">[[${num}]]</a>
                </li>
                <li th:if="${pageInfo.endPageNum < pageInfo.totalPageCount}">
                    <a th:href="@{/layout(pageNum=${pageInfo.endPageNum + 1})}">다음</a>
                </li>
            </ul>
        </div>
    </div>
<script th:inline="javascript">
    function gomain(){
        location.href="/content/requestList";
    }

    function goinbound(pageNum = 1){
        const table=document.getElementById("Table");
        const paging=document.getElementById("pagingArea");

        fetch(`/goinbound?pageNum=${pageNum}`)
            .then(resp=>resp.json())
            .then(data=>{

                const list=data.list; 
                const pageInfo=data.pageInfo;

                //테이블 초기화
                table.innerHTML=`
                                <tr>
                                    <th>번호</th><th>요청자</th><th>승인 상태</th><th>요청일</th><th>상세보기</th>
                                </tr>
                                `;
                paging.innerHTML="";

                //목록 출력
                list.forEach(l=>{
                    table.innerHTML+=`
                                    <tr>
                                        <td>${l.inbound_id}</td><td>${l.webuser_id}</td>
                                        <td>${l.approval_status}</td><td>${l.request_date}</td>
                                        <td><button type="button"
                                                    data-io-id="${l.inbound_id}"
                                                    onclick="showInDetail(this)">상세보기</button></td>
                                    </tr>
                                    `;
                });

                //이전 버튼
                if (pageInfo.startPageNum > 1) {
                    paging.innerHTML += `
                    <li>
                        <a href="javascript:goinbound(${pageInfo.startPageNum - 1})">이전</a>
                    </li>
                `;
                }

                //페이지 번호
                for (let i = pageInfo.startPageNum; i <= pageInfo.endPageNum; i++) {
                    paging.innerHTML += `
                    <li>
                        <a href="javascript:goinbound(${i})">${i}</a>
                    </li>
                `;
                }

                //다음 버튼
                if (pageInfo.endPageNum < pageInfo.totalPageCount) {
                    paging.innerHTML += `
                    <li>
                        <a href="javascript:goinbound(${pageInfo.endPageNum + 1})">다음</a>
                    </li>
                `;
                }
            })
    }

    function gooutbound(pageNum = 1){
        const table=document.getElementById("Table");
        const paging=document.getElementById("pagingArea");

        fetch(`/gooutbound?pageNum=${pageNum}`)
            .then(resp=>resp.json())
            .then(data=>{

                const list=data.list;
                const pageInfo=data.pageInfo;

                //테이블 초기화
                table.innerHTML=`
                                <tr>
                                    <th>번호</th><th>요청자</th><th>승인 상태</th><th>요청일</th><th>상세보기</th>
                                </tr>
                                `;
                paging.innerHTML="";

                //목록 출력
                list.forEach(l=>{
                    table.innerHTML+=`
                                    <tr>
                                        <td>${l.outbound_id}</td><td>${l.webuser_id}</td>
                                        <td>${l.approval_status}</td><td>${l.request_date}</td>
                                        <td><button type="button"
                                                    data-io-id="${l.outbound_id}"
                                                    onclick="showOutDetail(this)">상세보기</button></td>
                                    </tr>
                                    `;
                });

                //이전 버튼
                if (pageInfo.startPageNum > 1) {
                    paging.innerHTML += `
                    <li>
                        <a href="javascript:gooutbound(${pageInfo.startPageNum - 1})">이전</a>
                    </li>
                `;
                }

                //페이지 번호
                for (let i = pageInfo.startPageNum; i <= pageInfo.endPageNum; i++) {
                    paging.innerHTML += `
                    <li>
                        <a href="javascript:gooutbound(${i})">${i}</a>
                    </li>
                `;
                }

                //다음 버튼
                if (pageInfo.endPageNum < pageInfo.totalPageCount) {
                    paging.innerHTML += `
                    <li>
                        <a href="javascript:gooutbound(${pageInfo.endPageNum + 1})">다음</a>
                    </li>
                `;
                }
            })
    }

    let status = /*[[${status}]]*/ null;
    let msg = /*[[${msg}]]*/ null;

    if (status && msg) {
        alert(msg);
    }

    function showInDetail(btn) {
        const currentTr = btn.closest("tr");
        const colCount = currentTr.children.length;

        // 이미 상세 row 있으면 토글
        if (currentTr.nextElementSibling &&
            currentTr.nextElementSibling.classList.contains("detailRow")) {
            currentTr.nextElementSibling.remove();
            return;
        }

        const bound_id = btn.dataset.ioId;

        fetch(`/request/admin/inbound?inbound_id=${bound_id}`)
            .then(resp => resp.json())
            .then(data => {
                const detailRow = document.createElement("tr");
                detailRow.classList.add("detailRow");

                const td = document.createElement("td");
                td.setAttribute("colspan", colCount);

                const list=data.list;
                const name=data.names;

                let innerTable = `<table class="detailTable" style="width:100%;">
                                <tr>
                                    <th>상품명</th>
                                    <th>수량</th>
                                    <th>요청 상세</th>
                                    <th>승인/반려</th>
                                </tr>`;

                list.forEach(l => {
                    const d=l.inbound_detail_id;
                    const n=name[String(d)];

                    innerTable += `<tr data-detail-id="${l.inbound_detail_id}"
                                      data-inbound-id="${l.inbound_id}"
                                      data-quantity="${l.quantity}">
                                    <td>${n}</td>
                                    <td>${l.quantity}</td>
                                    <td>${l.approval_status}</td>
                                    <td>
                                        <button type="button" onclick="approveItem(this)">승인</button>
                                        <button type="button" onclick="rejectItem(this)">반려</button>
                                    </td>
                                </tr>`;
                                /*<tr>
                                    <th colspan="4"><button data-inbound-id="${l.outbound_id}"
                                            onclick="allApprove(this)">전체 수락</button></th>
                                </tr>*/ <!-- 이거 옮겼습니다 (✨프론트 노예가)-->
                });


                innerTable += `
                                <tr class="detail-footer">
                                    <td colspan="4" style="text-align: right; padding: 15px;">
                                        <button type="button" class="all-approve-btn" data-io-id="${bound_id}" onclick="allApprove(this)">✨ 전체 수락</button>
                                    </td>
                                </tr>
                                </table>`; <!-- 여기로 -->
                td.innerHTML = innerTable;
                detailRow.appendChild(td);
                currentTr.insertAdjacentElement("afterend", detailRow);
            });
    }

    function showOutDetail(btn) {
        const currentTr = btn.closest("tr");
        const colCount = currentTr.children.length;

        // 이미 상세 row 있으면 토글
        if (currentTr.nextElementSibling &&
            currentTr.nextElementSibling.classList.contains("detailRow")) {
            currentTr.nextElementSibling.remove();
            return;
        }

        const bound_id =btn.dataset.ioId;

        fetch(`/request/admin/outbound?outbound_id=${bound_id}`)
            .then(resp => resp.json())
            .then(data => {
                const detailRow = document.createElement("tr");
                detailRow.classList.add("detailRow");

                const td = document.createElement("td");
                td.setAttribute("colspan", colCount);

                const list=data.list;
                const name=data.names;

                let innerTable = `<table class="detailTable" style="width:100%;">
                                <tr>
                                    <th>상품명</th>
                                    <th>수량</th>
                                    <th>요청 상세</th>
                                    <th>승인/반려</th>
                                </tr>`;

                list.forEach(l => {
                    const d=l.outbound_detail_id;
                    const n=name[String(d)];

                    innerTable += `<tr data-detail-id="${l.outbound_detail_id}"
                                        data-inbound-id="${l.outbound_id}"
                                        data-quantity="${l.quantity}">
                                    <td>${n}</td>
                                    <td>${l.quantity}</td>
                                    <td>${l.approval_status}</td>
                                    <td>
                                        <button type="button" onclick="approveItem(this)">승인</button>
                                        <button type="button" onclick="rejectItem(this)">반려</button>
                                    </td>
                                </tr>`;
                                /*<tr>
                                    <th colspan="4"><button data-inbound-id="${l.outbound_id}"
                                            onclick="allApprove(this)">전체 수락</button></th>
                                </tr>*/ <!--이것도 옯겼습니다-->

                });

                innerTable += `
                                <tr class="detail-footer">
                                    <td colspan="4" style="text-align: right; padding: 15px;">
                                        <button type="button" class="all-approve-btn" data-io-id="${bound_id}" onclick="allApprove(this)">✨ 전체 수락</button>
                                    </td>
                                </tr>
                                </table>`; <!--여기로 background: #f8fafc; style="background-color: #10b981;"-->
                td.innerHTML = innerTable;
                detailRow.appendChild(td);
                currentTr.insertAdjacentElement("afterend", detailRow);
            });
    }

    function approveItem(btn){
        const tr = btn.closest("tr");

        const detailRow = tr.closest("tr.detailRow");
        const parentRow = detailRow.previousElementSibling;
        const ioType = parentRow.children[0].innerText.trim();

        if (ioType === "IN") {
            const detailId = tr.dataset.detailId;
            const quantity = tr.dataset.quantity;
            const inboundId = tr.closest("tr.detailRow").previousElementSibling.children[1].innerText.trim(); // 상위 inbound ID

            if (!confirm("이 항목을 승인하시겠습니까?")) return;

            // form-urlencoded 형식으로 보내기
            const params = new URLSearchParams();
            params.append("inbound_id", inboundId);
            params.append("inbound_detail_id", detailId);
            params.append("quantity", quantity); // DTO 필드 이름과 맞춰야 함
            params.append("approval_status", "APPROVED"); // DTO 필드 이름과 맞춰야 함

            fetch(`/admin/inbound_app`, {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: params.toString()
            })
                .then(resp => resp.json())
                .then(data => {
                    if (data.success) {
                        alert("승인 완료");

                        // 기존 상세 행 삭제
                        const detailRow = tr.closest("tr.detailRow");
                        if (detailRow) detailRow.remove();

                        // 새로 받아온 상세 리스트로 다시 추가
                        const list = data.detailList;
                        const name = data.names;

                        const newDetailRow = document.createElement("tr");
                        newDetailRow.classList.add("detailRow");

                        const td = document.createElement("td");
                        td.setAttribute("colspan", tr.children.length);

                        let innerTable = `<table class="detailTable" border="1" style="width:100%;">
                                    <tr>
                                        <th>상품명</th>
                                        <th>수량</th>
                                        <th>요청 상세</th>
                                        <th>승인/반려</th>
                                    </tr>`;

                        list.forEach(item => {
                            const d = item.outbound_detail_id;
                            const n = name[String(d)];

                            innerTable += `<tr data-item-id="${item.inbound_detail_id}">
                                    <td>${n}</td>
                                    <td>${item.quantity}</td>
                                    <td>${item.approval_status}</td>
                                    <td>
                                        <button type="button" onclick="approveItem(this)">승인</button>
                                        <button type="button" onclick="rejectItem(this)">반려</button>
                                    </td>
                                </tr>`;
                        });

                        innerTable += `</table>`;
                        td.innerHTML = innerTable;
                        newDetailRow.appendChild(td);
                        tr.insertAdjacentElement("afterend", newDetailRow);

                    } else {
                        alert("승인 실패");
                    }
                });
        }else {
            const detailId = tr.dataset.detailId;
            const outboundId = tr.closest("tr.detailRow").previousElementSibling.children[1].innerText.trim(); // 상위 outbound ID

            if (!confirm("이 항목을 승인하시겠습니까?")) return;

            // form-urlencoded 형식으로 보내기
            const params = new URLSearchParams();
            params.append("outbound_id", outboundId);
            params.append("outbound_detail_id", detailId); // DTO 필드 이름과 맞춰야 함
            params.append("approval_status", "APPROVED"); // DTO 필드 이름과 맞춰야 함

            fetch(`/admin/outbound_app`, {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: params.toString()
            })
                .then(resp => resp.json())
                .then(data => {
                    if (data.success) {
                        alert("승인 완료");

                        // 기존 상세 행 삭제
                        const detailRow = tr.closest("tr.detailRow");
                        if (detailRow) detailRow.remove();

                        // 새로 받아온 상세 리스트로 다시 추가
                        const list = data.detailList;
                        const name = data.names;

                        const newDetailRow = document.createElement("tr");
                        newDetailRow.classList.add("detailRow");

                        const td = document.createElement("td");
                        td.setAttribute("colspan", tr.children.length);

                        let innerTable = `<table class="detailTable" border="1" style="width:100%;">
                                    <tr>
                                        <th>상품명</th>
                                        <th>수량</th>
                                        <th>요청 상세</th>
                                        <th>승인/반려</th>
                                    </tr>`;

                        list.forEach(item => {
                            const d = item.outbound_detail_id;
                            const n = name[String(d)];

                            innerTable += `<tr data-item-id="${item.outbound_detail_id}">
                                    <td>${n}</td>
                                    <td>${item.quantity}</td>
                                    <td>${item.approval_status}</td>
                                    <td>
                                        <button type="button" onclick="approveItem(this)">승인</button>
                                        <button type="button" onclick="rejectItem(this)">반려</button>
                                    </td>
                                </tr>`;
                        });

                        innerTable += `</table>`;
                        td.innerHTML = innerTable;
                        newDetailRow.appendChild(td);
                        tr.insertAdjacentElement("afterend", newDetailRow);

                    } else {
                        alert("승인 실패");
                    }
                })
        }
    }


    function rejectItem(btn){
            const tr = btn.closest("tr");

            // 이미 텍스트박스 있으면 중복 생성 방지
            if (tr.nextElementSibling && tr.nextElementSibling.classList.contains("rejectRow")) {
                return;
            }

            const rejectRow = document.createElement("tr");
            rejectRow.classList.add("rejectRow");

            const td = document.createElement("td");
            td.setAttribute("colspan", tr.children.length);

            td.innerHTML = `
        <label>반려 사유: </label>
        <input type="text" id="rejectReason" placeholder="사유 입력">
        <button type="button" onclick="submitReject(this)">제출</button>
        <button type="button" onclick="cancelReject(this)">취소</button>
    `;

            rejectRow.appendChild(td);
            tr.insertAdjacentElement("afterend", rejectRow);

    }

    function submitReject(btn){
        const rejectRow = btn.closest("tr");
        const reason = rejectRow.querySelector("#rejectReason").value;

        const detailRowContainer = rejectRow.closest("tr.detailRow");
        const parentRow = detailRowContainer.previousElementSibling;
        const ioType = parentRow.children[0].innerText.trim();

        if (ioType === "IN") {
            const detailRow = rejectRow.previousElementSibling; // 상세 테이블 행
            const detailId = detailRow.dataset.detailId; // inbound_detail_id
            const inboundId = detailRow.closest("tr.detailRow").previousElementSibling.children[1].innerText.trim(); // 상위 inbound ID

            if (!reason.trim()) {
                alert("사유를 입력하세요.");
                return;
            }

            // form-urlencoded 형식으로 보내기 (승인 함수와 동일 구조)
            const params = new URLSearchParams();
            params.append("inbound_id", inboundId);          // 쿼리 파라미터로 넘어가는 inbound_id
            params.append("inbound_detail_id", detailId);    // DTO 필드
            params.append("approval_status", "REJECTED");    // DTO 필드
            params.append("reason", reason);                 // DTO 필드

            fetch(`/admin/inbound_app`, {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: params.toString()
            })
                .then(resp => resp.json())
                .then(data => {
                    if (data.success) {
                        alert("반려 완료");

                        // 기존 상세 행 삭제
                        const detailRowContainer = detailRow.closest("tr.detailRow");
                        if (detailRowContainer) detailRowContainer.remove();

                        // 새로 받아온 상세 리스트로 다시 추가
                        const list = data.detailList;
                        const name = data.names;

                        const newDetailRow = document.createElement("tr");
                        newDetailRow.classList.add("detailRow");

                        const td = document.createElement("td");
                        td.setAttribute("colspan", detailRow.children.length);

                        let innerTable = `<table class="detailTable" border="1" style="width:100%;">
                                <tr>
                                    <th>상품명</th>
                                    <th>수량</th>
                                    <th>요청 상세</th>
                                    <th>승인/반려</th>
                                </tr>`;

                        list.forEach(item => {
                            const d = item.outbound_detail_id;
                            const n = name[String(d)];

                            innerTable += `<tr data-detail-id="${item.inbound_detail_id}">
                                    <td>${n}</td>
                                    <td>${item.quantity}</td>
                                    <td>${item.approval_status}</td>
                                    <td>
                                        <button type="button" onclick="approveItem(this)">승인</button>
                                        <button type="button" onclick="rejectItem(this)">반려</button>
                                    </td>
                                </tr>`;
                        });

                        innerTable += `</table>`;
                        td.innerHTML = innerTable;
                        newDetailRow.appendChild(td);
                        detailRow.closest("tr.detailRow").insertAdjacentElement("afterend", newDetailRow);

                    } else {
                        alert("반려 실패");
                    }
                });
        }else{
            const detailRow = rejectRow.previousElementSibling; // 상세 테이블 행
            const detailId = detailRow.dataset.detailId; // inbound_detail_id
            const outboundId = detailRow.closest("tr.detailRow").previousElementSibling.children[1].innerText.trim(); // 상위 inbound ID

            if (!reason.trim()) {
                alert("사유를 입력하세요.");
                return;
            }

            // form-urlencoded 형식으로 보내기 (승인 함수와 동일 구조)
            const params = new URLSearchParams();
            params.append("outbound_id", outboundId);          // 쿼리 파라미터로 넘어가는 inbound_id
            params.append("outbound_detail_id", detailId);    // DTO 필드
            params.append("approval_status", "REJECTED");    // DTO 필드
            params.append("reason", reason);                 // DTO 필드

            fetch(`/admin/outbound_app`, {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: params.toString()
            })
                .then(resp => resp.json())
                .then(data => {
                    if (data.success) {
                        alert("반려 완료");

                        // 기존 상세 행 삭제
                        const detailRowContainer = detailRow.closest("tr.detailRow");
                        if (detailRowContainer) detailRowContainer.remove();

                        // 새로 받아온 상세 리스트로 다시 추가
                        const list = data.detailList;
                        const name = data.names;

                        const newDetailRow = document.createElement("tr");
                        newDetailRow.classList.add("detailRow");

                        const td = document.createElement("td");
                        td.setAttribute("colspan", detailRow.children.length);

                        let innerTable = `<table class="detailTable" border="1" style="width:100%;">
                                <tr>
                                    <th>상품명</th>
                                    <th>수량</th>
                                    <th>요청 상세</th>
                                    <th>승인/반려</th>
                                </tr>`;

                        list.forEach(item => {
                            const d = item.outbound_detail_id;
                            const n = name[String(d)];

                            innerTable += `<tr data-detail-id="${item.inbound_detail_id}">
                                    <td>${n}</td>
                                    <td>${item.quantity}</td>
                                    <td>${item.approval_status}</td>
                                    <td>
                                        <button type="button" onclick="approveItem(this)">승인</button>
                                        <button type="button" onclick="rejectItem(this)">반려</button>
                                    </td>
                                </tr>`;
                        });

                        innerTable += `</table>`;
                        td.innerHTML = innerTable;
                        newDetailRow.appendChild(td);
                        detailRow.closest("tr.detailRow").insertAdjacentElement("afterend", newDetailRow);

                    } else {
                        alert("반려 실패");
                    }
                });
        }
    }

    function cancelReject(btn){
            const rejectRow = btn.closest("tr");
            rejectRow.remove();
    }

    function allApprove(){
        if (!confirm("정말 전체 승인하시겠습니까?")) return;

        fetch('/inbound/approve/all', {
            method: 'POST'
        })
            .then(res => {
                if (!res.ok) throw new Error();
                alert("전체 승인 완료");
                location.reload();
            })
            .catch(() => alert("전체 승인 실패"));
    }

</script>
</section>
