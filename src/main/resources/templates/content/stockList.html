<section xmlns:th="http://www.thymeleaf.org"
         th:fragment="content">
    <h1>재고확인목록</h1>
    <div>
        <form th:action="@{/stockList}" method="get">
            <button type="submit">전체</button>
            <button type="submit" name="status" value="COLD">냉장</button>
            <button type="submit" name="status" value="ROOM">실온</button>
            <button type="submit" name="status" value="FROZEN">냉동</button>
        </form>
    </div>
    <table>
        <tr>
            <th>재고번호</th>
            <th>재고이름</th>
            <th>카테고리</th>
            <th>가격</th>
            <th>수량</th>
            <th>단위</th>
            <th>이미지</th>
            <th>제품종류</th>

        </tr>
        <tr th:each="ps : ${p}" th:if="${ps != null}">

            <td th:text="${ps.product_id}"></td>
            <td th:text="${ps.product_name}"></td>
            <td th:text="${ps.category_path}"></td>
            <td th:text="${ps.price}"></td>

            <!-- 수량 수정 폼 -->
            <td>
                <form th:action="@{/stock/update}" method="post" style="display:flex; justify-content:center; gap:4px;">
                    <input type="number"
                           name="quantity"
                           th:value="${ps.quantity}"
                           min="0"
                           style="width:60px; text-align:center;">
                    <input type="text" name="productId" th:value="${ps.product_id}" hidden>
                    <button type="submit">수정</button>
                </form>
            </td>

            <td th:text="${ps.unit}"></td>
            <td>
                <img th:src="@{'/image/' + ${ps.save_name}}" style="width:100px;">
            </td>

            <td th:text="${ps.status}"></td>
        </tr>
    </table>
    <div>
        <form th:action="@{/stockList}" method="get">
            <input type="text" placeholder="상품명 또는 카테고리" name="keyword">
            <input type="submit" value="검색">
        </form>
    </div>
    <div th:if="${pageInfo != null and pageInfo.totalPageCount > 1}">
        <ul>
            <li th:if="${pageInfo.startPageNum > 1}">
                <a th:href="@{/stockList(pageNum=${pageInfo.startPageNum - 1})}">이전</a>
            </li>
            <li th:each="num:${#numbers.sequence(pageInfo.startPageNum,pageInfo.endPageNum)}">
                <a th:href="@{/stockList(pageNum=${num},status=${status},keyword=${keyword})}">[[${num}]]</a>
            </li>
            <li th:if="${pageInfo.endPageNum < pageInfo.totalPageCount}">
                <a th:href="@{/stockList(pageNum=${pageInfo.endPageNum + 1})}">다음</a>
            </li>
        </ul>
    </div>
</section>
