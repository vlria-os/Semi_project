    <h1>재고확인목록</h1>
    <form th:action="@{/stocklist}" th:method="get">
        <input type="text" name="keyword" placeholder="상품명 또는 카테고리명" th:value="${keyword}">
        <button type="submit" name="status" value="COLD">냉장</button>
        <button type="submit" name="status" value="FROZEN">냉동</button>
        <button type="submit" name="status" value="ROOM">상온</button>
        <button type="submit">검색</button>
    </form>

    <table>
        <tr>
            <th>상품번호</th>
            <th>재고이름</th>
            <th>카테고리</th>
            <th>가격</th>
            <th>수량</th>
            <th>단위</th>
            <th>이미지</th>
            <th>제품종류</th>

        </tr>
        <tr th:each="ps : ${p}" th:if="${ps != null}">

            <td th:text="${ps.product_id}"></td>

            <td>[[${ps.product_name}]]</td>
            <td>[[${ps.category_path}]]</td>
            <td>[[${ps.price}]]</td>

            <!-- 수량 수정 폼 -->
            <td>
                <form th:action="@{/stock/update}" method="post" style="display:flex; justify-content:center; gap:4px;">
                    <input type="number"
                           name="quantity"
                           th:value="${ps.quantity}"
                           min="0"
                           style="width:60px; text-align:center;">
                    <input type="hidden" name="productId" th:value="${ps.product_id}">

                    <button type="submit">수정</button>
                </form>
            </td>

            <td>[[${ps.unit}]]</td>
            <td>
                <img th:if="${ps.image_path != null}"
                     th:src="@{/image/{save_name}(save_name=${ps.image_path})}"
                     alt="상품이미지" style="max-width:60px; max-height:60px;">
            </td>

            <td>[[${ps.status}]]</td>
        </tr>


    </table>

    <!-- 통합 페이징 -->
    <div class="paging" style="text-align:center; margin-top:20px;">
        <!-- 처음 페이지 -->
        <a th:href="@{/stocklist(pagenum=1, keyword=${keyword}, status=${status})}"
           th:classappend="${pagenum == 1} ? 'disabled'"><<</a>

        <!-- 이전 페이지 -->
        <a th:href="@{/stocklist(pagenum=${pagenum - 1}, keyword=${keyword}, status=${status})}"
           th:classappend="${pagenum == 1} ? 'disabled'"><</a>

        <!-- 페이지 번호 -->
        <span th:each="i : ${#numbers.sequence(1, totalPage)}">
        <a th:href="@{/stocklist(pagenum=${i}, keyword=${keyword}, status=${status})}"
           th:text="${i}"
           th:classappend="${pagenum == i} ? 'current'"></a>
    </span>

        <!-- 다음 페이지 -->
        <a th:href="@{/stocklist(pagenum=${pagenum + 1}, keyword=${keyword}, status=${status})}"
           th:classappend="${pagenum == totalPage} ? 'disabled'">></a>

        <!-- 마지막 페이지 -->
        <a th:href="@{/stocklist(pagenum=${totalPage}, keyword=${keyword}, status=${status})}"
           th:classappend="${pagenum == totalPage} ? 'disabled'">>></a>
    </div>
</section>
