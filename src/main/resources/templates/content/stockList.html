<section xmlns:th="http://www.thymeleaf.org"
         th:fragment="content">
    <link rel="stylesheet" th:href="@{/css/content/stocklist.css}">
    <div class="main">
        <h1>재고확인목록</h1>
            <div class="search-container">
                <div class="search-bar">
                    <form th:action="@{/stockList}" method="get">
                        <input type="hidden" name="status" th:value="${status}">
                        <input type="text" placeholder="상품명 또는 카테고리" name="keyword" th:value="${keyword}">
                        <input type="submit" value="검색">
                    </form>
                </div>
                <div class="nav-toggle">
                    <form th:action="@{/stockList}" method="get">
                        <button type="submit" class="view-btn" th:classappend="${status == null || status == ''} ? 'active' : ''">전체</button>
                        <button type="submit" name="status" value="COLD" class="view-btn" th:classappend="${status == 'COLD'} ? 'active' : ''">냉장</button>
                        <button type="submit" name="status" value="ROOM" class="view-btn" th:classappend="${status == 'ROOM'} ? 'active' : ''">실온</button>
                        <button type="submit" name="status" value="FROZEN" class="view-btn" th:classappend="${status == 'FROZEN'} ? 'active' : ''">냉동</button>
                    </form>
                </div>
        </div>

        <table id="Table">
            <thead>
                <tr>
                    <th>재고번호</th>
                    <th>재고이름</th>
                    <th>카테고리</th>
                    <th>가격</th>
                    <th>수량</th>
                    <th>단위</th>
                    <th>이미지</th>
                    <th>제품종류</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="ps : ${p}">
                    <td th:text="${ps.product_id}"></td>
                    <td th:text="${ps.product_name}"></td>
                    <td th:text="${ps.category_path}"></td>
                    <td th:text="${ps.price}"></td>

                    <!-- 수량 수정 폼 -->
                    <td>
                        <input type="text"
                               name="quantity"
                               th:value="${ps.quantity}"
                               style="width:60px; text-align:center;"
                               readonly
                        >
                        <button type="button" th:data-product-id="${ps.product_id}" onclick="quantityUpdate(this)" class="action-btn">수정</button>
                    </td>

                    <td th:text="${ps.unit}"></td>
                    <td>
                        <img th:src="@{'/image/' + ${ps.save_name}}" style="width:100px;">
                    </td>

                    <td>
                        <span class="status-tag"
                              th:classappend="${ps.status == 'COLD' ? 'status-cold' :
                              ps.status == 'FROZEN' ? 'status-frozen' :
                              ps.status == 'ROOM' ? 'status-room' : ''}"
                              th:text="${ps.status}"></span>
                    </td>
                </tr>
            </tbody>
        </table>
        <div th:if="${pageInfo != null and pageInfo.totalPageCount > 1}" id="pagingArea">
            <ul>
                <li th:if="${pageInfo.startPageNum > 1}">
                    <a th:href="@{/stockList(pageNum=${pageInfo.startPageNum - 1}, status=${status}, keyword=${keyword})}">이전</a>
                </li>
                <li th:each="num:${#numbers.sequence(pageInfo.startPageNum,pageInfo.endPageNum)}">
                    <a th:href="@{/stockList(pageNum=${num},status=${status},keyword=${keyword})}">[[${num}]]</a>
                </li>
                <li th:if="${pageInfo.endPageNum < pageInfo.totalPageCount}">
                    <a th:href="@{/stockList(pageNum=${pageInfo.endPageNum + 1}, status=${status}, keyword=${keyword})}">다음</a>
                </li>
            </ul>
        </div>
    </div>
</section>
<script>
    function quantityUpdate(btn) {
        const currentTr=btn.closest("tr");
        const colCount = currentTr.children.length;

        // 이미 상세 row 있으면 토글
        if(currentTr.nextElementSibling &&
            currentTr.nextElementSibling.classList.contains("quantityRow")){
            currentTr.nextElementSibling.remove();
            return;
        }

        const productId=btn.dataset.productId;

        fetch(`/stock/updateForm?productId=${productId}`)
            .then(resp=>resp.json())
            .then(list=>{

                const tr=document.createElement("tr");
                tr.className="quantityRow";

                let rows="";

                list.forEach(l => {

                    let quantityBtn=`
                                    <form action="/stock/update" method="post">
                                        <input type="number" name="quantity" value="${l.quantity}">
                                        <input type="hidden" name="stockId" value="${l.stockId}">
                                        <input type="hidden" name="lotInId" value="${l.lotInId}">
                                        <button type="submit">수정</button>
                                    </form>
                                    `;

                    rows += `
                             <tr>
                                <td>${l.lotInId}</td>
                                <td>${l.productName}</td>
                                <td>${quantityBtn}</td>
                                <td>${l.expirationDate}</td>
                             </tr>
                            `;
                });

                tr.innerHTML=`
                  <td colspan="${colCount}">
                     <table>
                     <tr>
                        <th>로트 번호</th><th>상품명</th><th>수량</th><th>유통기한</th>
                     </tr>
                     ${rows}
                     </table>
                  </td>
                  `;

                currentTr.after(tr);
            })
    }
</script>
