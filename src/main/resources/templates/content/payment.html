<section xmlns:th="http://www.thymeleaf.org" th:fragment="content">
  <link rel="stylesheet" th:href="@{/css/content/payment.css}">
  <div class="main">
    <h2>월말 정산</h2>
    <div class="month-selector" style="display:flex; align-items:center; gap:10px; margin-bottom:20px; justify-content:center;">
      <button id="prevMonth">&lt; 이전</button>
      <span id="currentMonth" style="font-weight:600;">2026-01</span>
      <button id="nextMonth">다음 &gt;</button>
    </div>
    <table id="Table">
      <thead>
      <tr>
        <th>결제번호</th>
        <th>기간</th>
        <th>입금/출금</th>
        <th>회사명</th>
        <th>결제금액</th>
        <th>결제</th>
      </tr>
      </thead>

      <tbody id="paymentBody">
      <tr th:each="l : ${list}" th:id="'row_' + ${l.settlement_id}"
          th:data-total-pay="${l.total_pay}">
        <td th:text="${l.settlement_id}"></td>
        <td th:text="${#temporals.format(l.period, 'yyyy-MM')}"></td>
        <td th:text="${l.inout}"></td>
        <td th:text="${l.company_name}"></td>
        <td th:text="${l.total_pay}"></td>
        <td>
          <div th:if="${l.payment_status == 'N'}">
             <button th:if="${l.inout == 'out'}" class="payButton">결제하기</button>
              <div th:if="${l.inout == 'in'}">
                <button class="btn-link"
                        th:data-settlement_id="${l.settlement_id}">
                  링크 복사
                </button>
                <button class="btn-check"
                        th:data-settlement_id="${l.settlement_id}">
                  입금 확인
                </button>
            </div>
          </div>
          <div th:if="${l.payment_status == 'Y'}">
            <span class="status-done">결제완료</span>
          </div>
      </tbody>
    </table>
  </div>
</section>

<script src="https://js.tosspayments.com/v2/standard"></script>
<script>
  let currentMonth = new Date(); // 오늘 기준
  const paymentBody = document.getElementById("paymentBody");
  const currentMonthSpan = document.getElementById("currentMonth");

  function formatMonth(date) {
    return date.toISOString().slice(0,7); // YYYY-MM
  }

  function updateMonthDisplay() {
    currentMonthSpan.textContent = formatMonth(currentMonth);
  }

  // 월 변경 버튼 이벤트
  document.getElementById("prevMonth").addEventListener("click", () => {
    currentMonth.setMonth(currentMonth.getMonth() - 1);
    updateMonthDisplay();
    loadPayments();
  });

  document.getElementById("nextMonth").addEventListener("click", () => {
    currentMonth.setMonth(currentMonth.getMonth() + 1);
    updateMonthDisplay();
    loadPayments();
  });

  // 월별 데이터 불러오기
  async function loadPayments() {
    const monthStr = formatMonth(currentMonth); // "2026-01"

    try {
      const response = await fetch(`/payment/list?month=${monthStr}`);
      if (!response.ok) throw new Error("데이터 불러오기 실패");

      const list = await response.json(); // 서버에서 JSON 형식으로 반환
      paymentBody.innerHTML = ""; // 기존 테이블 초기화

      list.forEach(l => {
        const tr = document.createElement("tr");
        tr.id = `row_${l.settlement_id}`;
        tr.dataset.totalPay = l.total_pay;
        tr.innerHTML = `
        <td>${l.settlement_id}</td>
        <td>${l.period}</td>
        <td>${l.inout}</td>
        <td>${l.company_name}</td>
        <td>${l.total_pay}</td>
        <td>
          ${l.payment_status === 'N'
                ? (l.inout === 'out'
                        ? `<button class="payButton">결제하기</button>`
                        : `<button class="btn-link" data-settlement_id="${l.settlement_id}">링크 복사</button>
                   <button class="btn-check" data-settlement_id="${l.settlement_id}">입금 확인</button>`)
                : `<span class="status-done">결제완료</span>`}
        </td>
      `;
        paymentBody.appendChild(tr);
      });

      // 새로 생성된 버튼 이벤트 다시 바인딩
      bindPaymentButtons();
    } catch (e) {
      console.error(e);
      alert("결제 내역 불러오기 실패");
    }
  }

  // 기존 결제 버튼 이벤트 바인딩 함수를 따로 뺌
  function bindPaymentButtons() {
    const clientKey = "test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm";
    const tossPayments = new TossPayments(clientKey);
    const customerKey = "6JKXrNpeN511woC64RWuD";

    // payButton 이벤트
    document.querySelectorAll(".payButton").forEach(btn => {
      // 이미 이벤트가 붙어있으면 건너뛰기
      if (btn.dataset.bound) return;
      btn.dataset.bound = true;

      btn.addEventListener("click", async function () {
        const row = btn.closest("tr");
        const totalPay = Math.abs(parseInt(row.dataset.totalPay));

        const existing = row.nextElementSibling;
        if (existing && existing.classList.contains("paymentRow")) {
          existing.remove();
          return;
        }

        const paymentTr = document.createElement("tr");
        paymentTr.classList.add("paymentRow");
        paymentTr.innerHTML = `
        <td colspan="6">
          <div id="payment-method-${row.id}"></div>
          <div id="agreement-${row.id}"></div>
          <button id="modalPayButton-${row.id}">결제 진행</button>
        </td>
      `;
        row.after(paymentTr);

        const widgets = tossPayments.widgets({customerKey});
        await widgets.setAmount({currency: "KRW", value: totalPay});

        widgets.renderPaymentMethods({selector: `#payment-method-${row.id}`, variantKey: "DEFAULT"});
        widgets.renderAgreement({selector: `#agreement-${row.id}`, variantKey: "AGREEMENT"});

        const settlementId = row.id.replace("row_", "");
        document.getElementById(`modalPayButton-${row.id}`).addEventListener("click", async function () {
          await widgets.requestPayment({
            orderId: "SETTLE_" + settlementId,
            orderName: "월말 정산",
            successUrl: window.location.origin + "/payment/success?settlementId=" + settlementId,
            failUrl: window.location.origin + "/",
            customerEmail: "admin@gmail.com",
            customerName: "admin",
            customerMobilePhone: "01012341234"
          });
        });
      });
    });

    document.querySelectorAll(".btn-link").forEach(btn => {
      btn.addEventListener("click", async function () {
        const settlementId = btn.dataset.settlement_id;

        // 원하는 주소 형식
        const link = `http://192.168.0.37:8080/payment/guest/${settlementId}`;

        try {
          await navigator.clipboard.writeText(link);
          alert("링크가 복사되었습니다!\n" + link);
        } catch (e) {
          console.error(e);
          alert("링크 복사 실패");
        }
      });
    });
    document.querySelectorAll(".btn-check").forEach(btn => {
      btn.addEventListener("click", async function () {
        const settlementId = btn.dataset.settlement_id;

        try {
          const response = await fetch(`/payment/success?settlementId=${settlementId}`, {
            method: "GET"  // GET 요청으로 컨트롤러 매핑에 맞춤
          });

          if (!response.ok) throw new Error("서버 오류 발생");

          // 성공 시 페이지 새로고침 또는 이동
          window.location.href = "/payment";

        } catch (e) {
          console.error(e);
          alert("결제 확인 처리 실패");
        }
      });
    });
  }

  // 초기 로드
  updateMonthDisplay();
  loadPayments();



</script>
