g<section xmlns:th="http://www.thymeleaf.org"
         th:fragment="content">
    <div class="main">
        <div>
            <button type="button" onclick="goAll()">전체</button>
            <button type="button" onclick="goIn()">입고</button>
            <button type="button" onclick="goOut('OUT')">출고</button>
        </div>
        <table id="table">
            <thead>
            <tr>
                <th>승인 번호</th><th>승인자</th><th>입출고</th><th>입출고 번호</th><th>승인 상태</th><th>승인일</th>
            </tr>
            </thead>
            <tbody id="tableBody">
            <tr th:each="l:${list}" onclick="showDetail(this)">
                <td th:text="${l.approval_id}"></td>
                <td th:text="${l.approver_id}"></td>
                <td th:text="${l.bound_type}"></td>
                <td th:text="${l.bound_type == 'IN' ? l.inbound_id : l.outbound_id}"></td>
                <td th:text="${l.approval_status}"></td>
                <td th:text="${l.created_at}"></td>
            </tr>
            </tbody>
        </table>

    </div>
    <form th:action="@{/approval/list}" method="get" id="serverForm">
        <select name="field" id="field">
            <option value="approval_id"
                    th:selected="${field == 'approval_id'}">승인 번호</option>
            <option value="approver_id"
                    th:selected="${field == 'approver_id'}">승인자</option>
        </select>
        <input type="text" name="keyword" id="keyword" th:value="${keyword}"
                        placeholder="검색어를 입력하세요.">
        <input type="submit" value="검색">
    </form>
    <form th:action="@{/approval/list/btn}" method="get" id="ajaxForm" style="display: none;"></form>
    <div id="pagingArea">
        <ul id="serverPaging">
            <li th:if="${pageInfo.startPageNum > 1}">
                <a th:href="@{/approval/list(pageNum=${pageInfo.startPageNum - 1})}">이전</a>
            </li>
            <li th:each="num:${#numbers.sequence(pageInfo.startPageNum,pageInfo.endPageNum)}">
                <a th:href="@{/approval/list(pageNum=${num},field=${field},keyword=${keyword})}">[[${num}]]</a>
            </li>
            <li th:if="${pageInfo.endPageNum < pageInfo.totalPageCount}">
                <a th:href="@{/approval/list(pageNum=${pageInfo.endPageNum + 1})}">다음</a>
            </li>
        </ul>
        <ul id="ajaxPaging" style="display: none;">
        </ul>
    </div>

<script>
    let ajaxBoundType = null;
    let ajaxPageNum = 1;

    function goAll(){
        location.href="/approval/list";
    }

    function goIn(){
        ajaxBoundType="IN";
        loadBtnPage(1);
    }

    function goOut(){
        ajaxBoundType = "OUT";
        loadBtnPage(1);
    }

    function loadBtnPage(pageNum){
        ajaxPageNum = pageNum;

        const tbody = document.getElementById("tableBody");
        const ajaxPaging=document.getElementById("ajaxPaging");
        const serverPaging=document.getElementById("serverPaging");

        if(serverPaging) serverPaging.style.display="none";
        ajaxPaging.style.display="block";

        const params=new URLSearchParams();
        params.set("pageNum",pageNum);
        params.set("boundType",ajaxBoundType);

        fetch(`/approval/list/btn?` + params.toString())
            .then(resp => resp.json())
            .then(data => {
                const list = data.list || [];
                const pageInfo = data.pageInfo;

                tbody.innerHTML="";

                if(list.length === 0){
                    tbody.innerHTML = `<tr><td colspan="6">조회 결과 없음</td></tr>`;
                    ajaxPaging.innerHTML = "";
                    return;
                }else {
                    list.forEach(l => {
                        const boundId = (l.bound_type === 'IN') ? l.inbound_id : l.outbound_id;
                        tbody.innerHTML += `
                                             <tr onclick="showDetail(this)">
                                                <td>${l.approval_id}</td>
                                                <td>${l.approver_id}</td>
                                                <td>${l.bound_type}</td>
                                                <td>${boundId ?? ''}</td>
                                                <td>${l.approval_status}</td>
                                                <td>${l.created_at}</td>
                                             </tr>
                                            `;
                    });
                }

                renderAjaxPaging(pageInfo);
            })
            .catch(console.error);
    }

    function renderAjaxPaging(pageInfo){
        const ajaxPaging=document.getElementById("ajaxPaging");
        ajaxPaging.innerHTML="";

        //이전
        if(pageInfo.startPageNum > 1){
            ajaxPaging.innerHTML +=`<li><a href="#" onclick="loadBtnPage(${pageInfo.startPageNum - 1})">이전</a></li>`;
        }

        for(let n = pageInfo.startPageNum; n <= pageInfo.endPageNum; n++){
            const active = (n === ajaxPageNum) ? 'style="font-weight:bold;"' : '';
            ajaxPaging.innerHTML += `
                                     <li><a ${active} href="#" onclick="loadBtnPage(${n}); return false;">${n}</a></li>
                                    `;
        }

        //다음
        if(pageInfo.endPageNum < pageInfo.totalPageCount){
            ajaxPaging.innerHTML += `
                                    <li><a href="#" onclick="loadBtnPage(${pageInfo.endPageNum + 1}); return false;">
                                        다음</a>
                                    </li>
                                    `;
        }
    }


    function showDetail(btn){
        const currentTr=btn.closest("tr");
        const colCount = currentTr.children.length;

        // 이미 상세 row 있으면 토글
        if(currentTr.nextElementSibling &&
            currentTr.nextElementSibling.classList.contains("detailRow")){
            currentTr.nextElementSibling.remove();
            return;
        }

        const bound_type=currentTr.children[2].innerText.trim();
        const bound_id=currentTr.children[3].innerText.trim();

        fetch(`/approval/detailList?bound_type=${bound_type}&bound_id=${bound_id}`)
            .then(resp=>resp.json())
            .then(data=>{

                const tr = document.createElement("tr");
                tr.className = "detailRow";

                let rows = "";

                data.forEach(l=>{

                    let reasonBtn="";

                    if(l.approval_status == 'rejected' && bound_type == 'in'){
                        reasonBtn = `
                                      <button onclick="showReason('in',${l.inbound_detail_id},
                                      this)">사유 보기</button>
                                    `;
                    }else if(l.approval_status == 'rejected' && bound_type == 'out'){
                        reasonBtn = `
                                      <button onclick="showReason('out',${l.outbound_detail_id},
                                      this)">사유 보기</button>
                                    `;
                    }

                    rows += `
                  <tr>
                    <td>${l.product_id}</td>
                    <td>${l.quantity}</td>
                    <td>${l.approval_status}
                        ${reasonBtn}
                    </td>
                  </tr>
                `;
                });

                    tr.innerHTML=`
                  <td colspan="${colCount}">
                     <table>
                     <tr>
                        <th>상품 번호</th><th>수량</th><th>승인 상태</th>
                     </tr>
                     ${rows}
                     </table>
                  </td>
                  `;

                    currentTr.after(tr);
                });
    }

    function showReason(bound_type,detail_id,btn){
        const currentTr=btn.closest("tr");

        // 이미 사유 row 있으면 토글
        if(currentTr.nextElementSibling &&
            currentTr.nextElementSibling.classList.contains("reasonRow")){
            currentTr.nextElementSibling.remove();
            return;
        }

        fetch(`/approval/showReason?detail_id=${detail_id}&bound_type=${bound_type}`)
            .then(resp=>resp.text())
            .then(reason=>{

                const tr=document.createElement("tr");
                tr.className="reasonRow";

                tr.innerHTML= `
                                <td colspan="3">
                                    ${reason}
                                </td>
                              `;

                currentTr.after(tr);
            })
    }
</script>
</section>
