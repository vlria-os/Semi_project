<!-- content/productList.html -->
<section xmlns:th="http://www.thymeleaf.org"
         th:fragment="content">
    <link rel="stylesheet" th:href="@{/css/content/inbound_req.css}">

    <div class="main">
    <h1>입고 요청</h1>
    <div class="search-container">
        <div class="search-bar">
            <input type="text" id="keyword" name="keyword" placeholder="상품명 또는 카테고리명"
                   onkeydown="if(event.key === 'Enter'){ event.preventDefault(); search(); }">
            <button type="submit" onclick="search()" class="btn-search">검색</button>
        </div>
        <div class="btn-area">
            <button type="button" id="resetSelection">선택 초기화</button>
            <button type="button" onclick="submitSelected()" class="btn-submit">입고요청</button>
        </div>
    </div>
<table>
    <thead>
    <tr>
        <th>선택</th>
        <th>상품번호</th>
        <th>이미지</th>
        <th>상품명</th>
        <th>단위</th>
        <th>가격</th>
        <th>분류</th>
        <th>카테고리</th>
        <th>창고</th>
        <th>수량</th>
    </tr>
    </thead>
    <tbody id="productBody">
    <tr th:each="l:${list}">
        <td>
            <input type="checkbox" class="chk" th:data-id="${l.product_id}" th:data-status="${l.status}">
        </td>
        <td th:text="${l.product_id}"></td>
        <td><img th:src="@{'/image/' + ${l.save_name}}" style="width:100px;"></td>
        <td th:text="${l.product_name}"></td>
        <td th:text="${l.unit}"></td>
        <td th:text="${l.price}"></td>
        <td th:text="${l.status}"></td>
        <td th:text="${l.category}"></td>
        <td>
            <select class="warehouse" disabled>
                <option value="">선택</option>
            </select>
        </td>
        <td>
            <input type="number" class="qty" min="1" disabled style="width:60px;">
        </td>
    </tr>
    </tbody>
</table>

    <div>
        <ul id="pagingArea" th:if="${pageInfo != null and pageInfo.totalPageCount > 1}">
            <li th:if="${pageInfo.startPageNum > 1}">
                <a th:href="@{/office_staff/inbound_req(pageNum=${pageInfo.startPageNum - 1}, field=${searchDto.field}, keyword=${searchDto.keyword})}">[이전]</a>
            </li>
            <li th:each="num:${#numbers.sequence(pageInfo.startPageNum,pageInfo.endPageNum)}">
                <a th:href="@{/office_staff/inbound_req(pageNum=${num}, field=${searchDto.field}, keyword=${searchDto.keyword})}">[[${num}]]</a>
            </li>
            <li th:if="${pageInfo.endPageNum < pageInfo.totalPageCount}">
                <a th:href="@{/office_staff/inbound_req(pageNum=${pageInfo.endPageNum + 1}, field=${searchDto.field}, keyword=${searchDto.keyword})}">[다음]</a>
            </li>
        </ul>
    </div>
    </div>

<script>
        const selectedMap = {};

        // 창고 불러오기
        async function loadWarehouses(selectEl, status, selectedWarehouse = '') {
        const res = await fetch(`/office_staff/inbound_req/warehouse?status=${encodeURIComponent(status)}`);
        const list = await res.json();

        selectEl.innerHTML = '<option value="">선택</option>';
        list.forEach(w => {
        const isSelected = w.warehouse_id == selectedWarehouse ? 'selected' : '';
        selectEl.innerHTML += `<option value="${w.warehouse_id}" ${isSelected}>${w.warehouse_name}</option>`;
    });

        const checkbox = selectEl.closest('tr').querySelector('.chk');
        selectEl.disabled = !(checkbox.checked);
    }

        // 초기 데이터 불러오기
        window.addEventListener('DOMContentLoaded', async () => {
        const savedMap = JSON.parse(sessionStorage.getItem('selectedMap') || '{}');
        Object.assign(selectedMap, savedMap);

        await search();
    });

        // 검색 및 테이블 렌더링
        async function search(pageNum = 1) {
        const keyword = document.getElementById("keyword").value;
        const res = await fetch(`/common/product_search?keyword=${encodeURIComponent(keyword)}&pageNum=${pageNum}`);
        const result = await res.json();

        const tbody = document.getElementById('productBody');
        tbody.innerHTML = '';

        for(const p of result.productDtos){
        const saved = selectedMap[p.product_id];

        tbody.innerHTML += `
<tr>
    <td><input type="checkbox" class="chk" data-id="${p.product_id}" data-status="${p.status}" ${saved ? 'checked' : ''}></td>
    <td>${p.product_id}</td>
    <td><img src="/image/${p.save_name}" style="width:100px;"></td>
    <td>${p.product_name}</td>
    <td>${p.unit}</td>
    <td>${p.price}</td>
    <td>${p.status}</td>
    <td>${p.category}</td>
    <td><select class="warehouse" ${saved ? '' : 'disabled'}></select></td>
    <td><input type="number" class="qty" min="1" value="${saved?.qty ?? ''}" ${saved ? '' : 'disabled'} style="width:60px;"></td>
</tr>
`;
        if(saved){
        const row = tbody.lastElementChild;
        const warehouseSelect = row.querySelector('.warehouse');
        const qtyInput = row.querySelector('.qty');
        qtyInput.disabled = false;
        await loadWarehouses(warehouseSelect, p.status, saved.warehouse);
        }
    }
        renderPaging(result.pageInfo);
    }

    function renderPaging(pageInfo){

    }

        // 체크박스, 창고, 수량 이벤트
        document.addEventListener('change', async e => {
        const row = e.target.closest('tr');
        if(!row) return;

        const checkbox = row.querySelector('.chk');
        const id = checkbox.dataset.id;
        const warehouse = row.querySelector('.warehouse');
        const qty = row.querySelector('.qty');

        if(e.target.classList.contains('chk')) {
        warehouse.disabled = !checkbox.checked;
        qty.disabled = !checkbox.checked;

        if(checkbox.checked){
        const status = checkbox.dataset.status;
        await loadWarehouses(warehouse, status);
        selectedMap[id] = { warehouse: warehouse.value || '', qty: qty.value || '' };
    } else {
        delete selectedMap[id];
        warehouse.innerHTML = '<option value="">선택</option>';
    }
    }

        if(e.target.classList.contains('warehouse') && selectedMap[id]){
        selectedMap[id].warehouse = e.target.value;
    }

        if(e.target.classList.contains('qty') && selectedMap[id]){
        selectedMap[id].qty = e.target.value;
    }

            sessionStorage.setItem('selectedMap', JSON.stringify(selectedMap));
    });

        // 입고요청
        function submitSelected() {
        const data = Object.entries(selectedMap).map(([product_id, info]) => ({
        product_id,
        warehouse_id: info.warehouse,
        quantity: info.qty
    }));

        fetch('/office_staff/inbound_req', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    })
        .then(res => res.json())
        .then(result => {
        if(result) alert('요청 완료');

        // 데이터만 초기화 (UI는 유지)
        Object.keys(selectedMap).forEach(id => delete selectedMap[id]);
            sessionStorage.removeItem('selectedMap');
    })
        .catch(err => console.error(err));
    }

        // 선택 초기화 버튼
        document.getElementById('resetSelection').addEventListener('click', () => {
        Object.keys(selectedMap).forEach(id => delete selectedMap[id]);

        document.querySelectorAll('#productBody tr').forEach(row => {
        const checkbox = row.querySelector('.chk');
        const warehouse = row.querySelector('.warehouse');
        const qty = row.querySelector('.qty');

        checkbox.checked = false;
        warehouse.value = '';
        warehouse.disabled = true;
        qty.value = '';
        qty.disabled = true;
    });
            sessionStorage.removeItem('selectedMap');
    });
    document.querySelectorAll('#pagingArea a').forEach(a => {
        a.addEventListener('click', e => {
            e.preventDefault(); // 기본 이동 막기
            const url = new URL(a.href);
            const pageNum = url.searchParams.get('pageNum') || 1;
            search(pageNum);
        });
    });

</script>
</section>
