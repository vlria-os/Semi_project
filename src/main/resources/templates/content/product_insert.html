<section xmlns:th="http://www.thymeleaf.org"
         th:fragment="content">
    <link rel="stylesheet" th:href="@{/css/content/productinsert.css}">

    <div class="main">
        <h2>✨상품 등록</h2>
        <form th:action="@{/content/product_insert}" method="post" th:object="${productDto}" enctype="multipart/form-data">

            <div th:if="${msg!=null}" class="error-msg">[[${msg}]]</div>

            <div class="form-group">
                <label>상품명</label>
                <input type="text" th:field="*{product_name}" placeholder="상품 이름을 입력하세요">
            </div>

            <div class="form-group" id="category-area">
                <label>카테고리</label>
                <select id="parentCategory" class="category-select" data-level="1">
                    <option value="">대분류 선택</option>
                    <option th:each="c : ${rootCategory}" th:value="${c.category_id}" th:text="${c.category_name}"></option>
                </select>

                <input type="hidden" name="category_id" id="finalCategoryId" th:field="*{category_id}">
            </div>

            <div class="form-group">
                <label>가격</label>
                <input type="number" th:field="*{price}" placeholder="0">
            </div>

            <div class="form-group">
                <label>단위</label>
                <input type="text" th:field="*{unit}" placeholder="예) Box, KG">
            </div>

            <div class="form-group">
                <label>보관 분류</label>
                <select name="status" th:field="*{status}">
                    <option value="COLD">냉장</option>
                    <option value="ROOM">실온</option>
                    <option value="FROZEN">냉동</option>
                </select>
            </div>

            <div class="form-group">
                <div class="file-upload-wrapper">
                    <label for="file" class="custom-file-upload">📁이미지 첨부</label>
                    <input type="file" id="file" th:field="*{file}">
                </div>
            </div>

            <button type="submit">상품 등록하기</button>
            <a th:href="@{/content/productList}" class="btn-back" style="flex: 1;">뒤로가기</a>
        </form>

<script>
    const categoryArea=document.getElementById("category-area");
    const finalInput=document.getElementById("finalCategoryId");

    categoryArea.addEventListener("change", function(e) {
        if(e.target.classList.contains('category-select')){
            const selectedId=e.target.value;
            const currentLevel=parseInt(e.target.getAttribute('data-level'));
            const allSelects=categoryArea.querySelectorAll(".category-select");

            allSelects.forEach(select => {
                if(parseInt(select.getAttribute('data-level')) > currentLevel) {
                    select.remove();
                }
            });
            finalInput.value= selectedId;

            if(!selectedId) return;

            fetch(`/content/product_category?parentId=${selectedId}`)
                .then(resp => resp.json())
                .then(data => {
                    if(data && data.length > 0){
                        const nextLevel= currentLevel +1;
                        const newSelect= document.createElement('select');

                        newSelect.className= 'category-select';
                        newSelect.setAttribute('data-level', nextLevel);
                        newSelect.style.marginTop= "10px";
                        newSelect.innerHTML=`<option value="">하위 카테고리 선택</option>`;

                        data.forEach(c => {
                            const opt= document.createElement("option");
                            opt.value= c.category_id;
                            opt.textContent= c.category_name;
                            newSelect.appendChild(opt);
                        });
                        categoryArea.appendChild(newSelect);
                        finalInput.value="";
                    }
                })
            .catch(error => console.error("Error fetching SubCategories: ", error));
        }
    });
