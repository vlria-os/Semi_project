<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>새 채팅</title>
</head>
<body>
<h2>사용자 목록</h2>
<ul>
    <li th:each="user:${users}">
        <a th:href="@{/chat/start/{targetId}(targetId=${user.webuser_id})}"
            th:text="${user.webuser_name}"></a>
    </li>
</ul>
<button onclick="history.back()">뒤로가기</button>
</body>
</html>
