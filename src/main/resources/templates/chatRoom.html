<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>chatRoom.html</title>
    <style>
      .chat-container {
        width: 400px;
        height: 600px;
        border: 1px solid #ddd;
        display: flex;
        flex-direction: column;
      }

      .chat-messages {
        flex: 1;
        padding: 10px;
        overflow-y: auto;
        background: #f9f9f9;
      }

      .message {
          position: relative;
          display: flex;
          align-items: flex-end;
          margin-bottom: 10px;
          flex-direction: column;
      }

      .message.me {
          align-items: flex-end;
      }

      .message.other {
          align-items: flex-start;
      }

      .meta {
          font-size: 10px;
          color: gray;
          margin-top: 2px;
      }

      .my-row{
          display:flex;
          align-items:flex-end;
          justify-content:flex-end;
          gap:6px;
      }

      /* 내 메시지 옆 숫자 */
      .my-row .meta{
          position: static !important;
          margin: 0;
          font-size: 10px;
          color: gray;
      }


      .sender-name {
          font-size: 12px;
          color: #666;
          margin-bottom: 2px;
      }


      .bubble {
        max-width: 70%;
        padding: 8px 12px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.4;
        word-break: break-word;
      }

      .message.me .bubble {
        background: #dcf8c6;
        border-bottom-right-radius: 4px;
      }

      .message.other .bubble {
        background: #fff;
        border: 1px solid #ddd;
        border-bottom-left-radius: 4px;
      }

      .chat-input {
        display: flex;
        padding: 10px;
        border-top: 1px solid #ddd;
        background: #fff;
      }

      .chat-input input {
        flex: 1;
        padding: 8px 10px;
        border-radius: 20px;
        border: 1px solid #ccc;
      }

      .chat-input button {
        margin-left: 5px;
        padding: 8px 12px;
      }


    </style>
</head>
<body>
<div class="chat-container">
    <button onclick="goToChatlist()">← 채팅 목록</button>
    <div style="padding:6px 10px; font-weight:bold;">
        <span th:text="${displayRoomName}">채팅방</span>
    </div>
    <!-- 접속 상태 표시 -->
    <div id="presence" style="font-size:12px;color:gray; padding:5px;">
        연결 중...
    </div>

    <!-- 메시지 영역 -->
  <div class="chat-messages" id="chatMessages">
      <div th:each="msg:${messages}"
           th:class="${msg.sender_id == user_id} ? 'message me' : 'message other'">

          <!-- 상대 이름 (말풍선 위) -->
          <div class="sender-name"
               th:if="${msg.sender_id != user_id}"
               th:text="${msg.senderName}">
          </div>

          <!-- 말풍선 -->
          <div class="bubble" th:text="${msg.content}"></div>

          <!-- 읽음 표시 (내 메시지) -->
          <div class="meta"
               th:if="${msg.sender_id == user_id and msg.read_count > 0}">
              <span class="read" th:text="${msg.read_count}"></span>
          </div>
      </div>
  </div>

  <!-- 입력 영역 -->
  <div>
    <div class="chat-input">
      <input type="hidden" name="room_id" th:value="${room_id}">
      <input type="hidden" name="sender_id" th:value="${user_id}">

      <input type="text" id="messageInput" name="content" placeholder="메시지를 입력하세요."
             autocomplete="off">
      <button type="button" onclick="handleSend()">전송</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script th:inline="javascript">
    const chatBox = document.getElementById("chatMessages");
    const room_id = /*[[${room_id}]]*/ 0; // Thymeleaf에서 방 번호 넣기
    const user_id = /*[[${user_id}]]*/ 0;       // 내 ID

    console.log("room_id: " + room_id + ", user_id: " + user_id);

    // 스크롤 내려주는 함수
    function scrollToBottom() {
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 메시지 화면에 추가하는 함수
    function addMessage(data) {
        const sid = (data.sender_id ?? data.senderId);
        const unread = (data.read_count ?? data.readCount ?? 0);
        const mid = (data.message_id ?? data.messageId ?? 0);

        const div = document.createElement("div");
        div.className = (sid == user_id) ? "message me" : "message other";
        div.dataset.messageId = mid;

        // 상대 메시지
        if (sid != user_id) {
            const name = data.senderName ?? data.sender_name ?? "";
            div.innerHTML = `
      <div class="sender-name">${name}</div>
      <div class="bubble">${data.content}</div>
    `;
        }
        // 내 메시지
        else {
            div.innerHTML = `
      <div class="my-row">
        ${unread > 0 ? `<div class="meta"><span class="read">${unread}</span></div>` : ``}
        <div class="bubble">${data.content}</div>
      </div>
    `;
        }

        chatBox.appendChild(div);
        scrollToBottom();
    }


    // STOMP 웹소켓 연결
    let stompClient = null;
    let currentPresenceCount = 0;

    const readerProgress = {}; // {userId: lastReadId}

    function connect() {
        const socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);

        stompClient.connect({
            roomId: room_id,
            userId: user_id
        },
            function(frame) {
            console.log("웹소켓 연결됨");

            //presence 구독
            stompClient.subscribe('/topic/presence/' + room_id, function(message) {
                currentPresenceCount = parseInt(message.body);
                const el = document.getElementById("presence");

                el.innerText=`현재 접속자 ${currentPresenceCount}명`;
            });

            // 채팅방 구독
            stompClient.subscribe('/topic/chat/' + room_id, function(message) {
                console.log("✅ chat topic 수신 raw:", message.body);
                const data = JSON.parse(message.body);
                console.log("수신된 메시지 전체: ", data);
                console.log("받은 data keys:", Object.keys(data));
                console.log("sender 비교:", data.sender_id, data.senderId, "vs", user_id);
                console.log("read_count 확인:", data.read_count, data.readCount);

                addMessage(data);

            });

                //채팅방 입장 알림
                stompClient.send("/app/chat/enter", {}, JSON.stringify({
                    roomId: room_id,
                    userId: user_id
                }));

                stompClient.subscribe('/topic/read/' + room_id, function (message){
                   const data = JSON.parse(message.body);
                   const readerId = data.userId;
                   const newLastRead = data.lastReadId;

                   if(readerId == user_id) return;

                   const prev = readerProgress[readerId] || 0;
                   if(newLastRead <= prev) return;

                   readerProgress[readerId] = newLastRead;

                   document.querySelectorAll(".message.me").forEach(el => {
                       const mid = parseInt(el.dataset.messageId || "0");
                       if(mid > prev && mid <= newLastRead){
                           const readSpan = el.querySelector(".read");
                           if(!readSpan) return;

                           let cnt = parseInt(readSpan.innerText || "0");
                           cnt --;

                           if(cnt <= 0){
                               readSpan.closest(".meta").remove();
                           }else {
                               readSpan.innerText = cnt;
                           }
                       }
                   })
                });
        });

    }

    connect(); //웹소켓 연결 시작

    window.onload = function (){
        scrollToBottom();
    }

    const input = document.getElementById("messageInput");

    // 메시지 보내기
    function sendMessage(content) {
        if(!stompClient || !stompClient.connected){
            console.log("❌ stomp 연결 안됨");
            return;
        }

        if(!content || content.trim() === "") return;

        const msg = {
            room_id: room_id,
            sender_id: user_id,
            content: content
        };

        console.log("📤 send", msg);
        stompClient.send("/app/chat/message", {}, JSON.stringify(msg));
    }

    function handleSend() {
        console.log("handleSend 클릭됨");
        const content = input.value.trim();
        if(content === "") return;

        //서버에 전송
        sendMessage(content);

        input.value="";
    }

    input.addEventListener("keydown", function(e){
        if(e.key === "Enter"){
            e.preventDefault(); // ⭐ 중요
            handleSend();
        }
    });

    // 페이지 떠날 때 채팅방 퇴장 처리
    window.addEventListener("beforeunload", function () {
        if (stompClient && stompClient.connected) {
            stompClient.send("/app/chat/leave", {}, JSON.stringify({
                roomId: room_id,
                userId: user_id
            }));
        }
    });

    function goToChatlist(){
        location.href="/chat/list";
    }
</script>
</body>
</html>
