
<aside th:fragment="sidebar" class="sidebar">
    <style>
        .progress-container{
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            height: 8px;
            margin-top: 4px;
            overflow: hidden;
        }
        .progress-bar{
            height: 100%;
            transition: width 0.5s ease-in-out;
        }
        .storage-limit span{
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .bg-safe{background-color: #4ade80;}
        .bg-warning{background-color: #fbbf24;}
        .bg-danger{background-color: #ef4444;}
    </style>
    <!-- sidebar -->
    <div class="sidebar" th:fragment="sidebarContent">
        <!--유통기한 임박-->
        <div class="expiration-notif" style="margin-bottom: 24px;">
            <div class="side-title">
                <span class="alert-icon">⚠️유통기한 임박</span>
                <a th:href="@{/fragment/sidebar/dueDate}" style="font-weight: bold; color: var(--navy); text-decoration: none;">유통기한 임박 목록</a>
            </div>
            <!-- 유통기한 임박 목록(10게(CSS))-->
            <div class="side-content">
                <ul th:if="${not #lists.isEmpty(dueList)}">
                    <li th:each="item : ${dueList}">
                        <span th:text="${item.product_name}"></span>
                        <span style="color: #ef4444; font-weight: bold;" th:text="'D-' + ${item.days_left}"></span>
                    </li>
                </ul>
                <div class="no-data" th:if="${#lists.isEmpty(dueList)}">
                    <p>임박한 상품이 없습니다.</p>
                </div>
            </div>
        </div>

        <!--재고 한계 임박-->
        <div class="storage-limit">
            <div class="side-title">
                <span class="storage-icon">🏗️창고 한계 임박</span>
                <a th:href="@{/warehouse/insert}" style="font-weight: bold; color: var(--navy); text-decoration: none;">+새창고 등록</a>
            </div>
            <!-- 재고 한계 임박 목록(10게(CSS))-->
            <div class="side-content">
                <ul th:if="${not #lists.isEmpty(limitList)}">
                    <li th:each="w : ${limitList}" style="margin-bottom: 15px; list-style: none;">
                        <div style="display: flex; justify-content: space-between;">
                            <span th:text="${w.warehouse_name}" style="font-weight: 500;"></span>
                            <span th:text="${w.usage_rate} + '%'" style="font-size: 0.85em;"></span>
                        </div>
                        <div class="progress-container">
                            <div class="progress-bar" th:style="|width: ${w.usage_rate}%|" th:classappend="${w.usage_rate >=90} ? 'bg-danger' : (${w.usage_rate >= 70} ? 'bg-warning' : 'bg-safe')">
                            </div>
                        </div>
                    </li>
                </ul>
                <div class="no-data" th:if="${#lists.isEmpty(limitList)}">
                    <p>창고 정보가 없습니다.</p>
                </div>
            </div>
        </div>
    </div>
    <div class="sidebar-ads">
        <div class="ads-grid">
            <div id="resultJeonbuk" class="ad-box"></div>
            <div id="resultChungnam" class="ad-box"></div>
            <div id="resultGangwon" class="ad-box"></div>
            <div id="resultDaejeon" class="ad-box"></div>
        </div>
    </div>
</aside>
