    <div class="header-left">
        <a th:href="@{/}" class="logo">
<!--            <img src="css/HSWH.svg" width="100px;" height="100px;">-->
        </a>
    </div>

    <div class="header-right">
        <button type="button" id="btnCheckIn" th:if="${session.YesterdayCheckOutLog != null && session.TodayCheckInLog == null}">출근</button>
        <button type="button" id="btnCheckOut" th:if="${session.TodayCheckInLog != null && session.TodayCheckOutLog == null}">퇴근</button>
        <!-- 채팅방 -->
        <a href="#" onclick="openChatWindow()" style="text-decoration: none; font-size: 1.2rem;">
            💬
            <span id="chatUnreadBadge" style="display:none;">0</span>
        </a>

        <!-- 로그인 사용자 이름 -->
        <span th:text="${session.roleMsg}" style="font-weight: 600; font-size: 14px; color: #cdb5e1;">
            사용자
        </span>

        <!-- 로그아웃 -->
        <a href="/logout" id="logoutBtn" class="logout">로그아웃</a>
    </div>
