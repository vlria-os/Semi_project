<header th:fragment="header" class="header">
    <div class="header-left">
        <a th:href="@{/}" class="logo">
<!--            <img src="css/HSWH.svg" width="100px;" height="100px;">-->
        </a>
    </div>

    <div class="header-right">
        <!-- 미퇴근 기록 없을 때 -->
        <button type="button"
                id="btnCheckIn"
                th:if="${session.openLog == null}">
            출근
        </button>
        <!-- 미퇴근 기록 있는데 오늘일 때 -->
        <button type="button"
                id="btnCheckOut"
                th:if="${session.openLog != null
                and session.openLog.workingDate == session.today}">
            퇴근
        </button>

        <!-- 채팅방 -->
        <a href="#" onclick="openChatWindow()" style="text-decoration: none; font-size: 1.2rem;">
            💬
            <span id="chatUnreadBadge" style="display:none; color: white;">0</span>
        </a>

        <!-- 로그인 사용자 이름 -->
        <span th:text="${session.webuserName}" style="font-weight: 600; font-size: 14px; color: #cdb5e1;"
              onclick="console.log('CLICK'); goMyWorkingLog();">
            사용자
        </span>

        <!-- 로그아웃 -->
        <a href="/logout" id="logoutBtn" class="logout">로그아웃</a>
    </div>

</header>
