<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 6px;
            text-align: center;
        }

        th {
            background: #eee;
        }

        input, button {
            padding: 4px;
        }

        a {
            display: inline-block;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<table>
    <thead>
    <tr>
        <th>선택</th>
        <th>상품번호</th>
        <th>상품명</th>
        <th>단위</th>
        <th>가격</th>
        <th>분류</th>
        <th>카테고리</th>
        <th>창고</th>
        <th>수량</th>
    </tr>
    </thead>
    <tbody id="productBody">
    <tr th:each="l:${list}">
        <td>
            <input type="checkbox" class="chk" th:data-id="${l.product_id}">
        </td>
        <td th:text="${l.product_id}"></td>
        <td th:text="${l.product_name}"></td>
        <td th:text="${l.unit}"></td>
        <td th:text="${l.price}"></td>
        <td th:text="${l.status}"></td>
        <td th:text="${l.category}"></td>
        <td>
            <select class="warehouse" disabled>
                <option value="">선택</option>
                <option value="1">창고A</option>
                <option value="2">창고B</option>
                <option value="3">창고C</option>
            </select>
        </td>
        <td>
            <input type="number" class="qty" min="1" disabled style="width:60px;">
        </td>
    </tr>
    </tbody>
</table>

<div>
    <input type="text" id="keyword" name="keyword" placeholder="상품명 또는 카테고리명"
           onkeydown="if(event.key === 'Enter'){ event.preventDefault(); search(); }">
    <button type="submit" onclick="search()">검색</button>
</div>

<button type="button" onclick="submitSelected()">입고요청</button>

<script>
    const selectedMap = {};

    function search(){
        const keyword=document.getElementById("keyword").value;

        fetch(`/common/product_search?keyword=${encodeURIComponent(keyword)}`)
            .then(res=>res.json())
            .then(list=>{
                const tbody=document.getElementById('productBody');
                tbody.innerHTML='';

                list.forEach(p => {
                    const saved = selectedMap[p.product_id];

                    tbody.innerHTML += `
    <tr>
        <td>
            <input type="checkbox" class="chk" data-id="${p.product_id}" ${saved ? 'checked' : ''}>
        </td>
        <td>${p.product_id}</td>
        <td>${p.product_name}</td>
        <td>${p.unit}</td>
        <td>${p.price}</td>
        <td>${p.status}</td>
        <td>${p.category}</td>
        <td>
            <select class="warehouse" ${saved ? '' : 'disabled'}>
                <option value="">선택</option>
                <option value="1" ${saved?.warehouse==='1'?'selected':''}>창고A</option>
                <option value="2" ${saved?.warehouse==='2'?'selected':''}>창고B</option>
                <option value="3" ${saved?.warehouse==='3'?'selected':''}>창고C</option>
            </select>
        </td>
        <td>
            <input type="number" class="qty" min="1" value="${saved?.qty ?? ''}" ${saved ? '' : 'disabled'} style="width:60px;">
        </td>
    </tr>
    `;
                });

            })
    };

    document.addEventListener('change', e => {
        const row = e.target.closest('tr');
        if(!row) return;

        const checkbox = row.querySelector('.chk');
        const id = checkbox.dataset.id;
        const warehouse = row.querySelector('.warehouse');
        const qty = row.querySelector('.qty');

        if(e.target.classList.contains('chk')) {
            warehouse.disabled = !checkbox.checked;
            qty.disabled = !checkbox.checked;

            if(checkbox.checked){
                selectedMap[id] = { warehouse: warehouse.value, qty: qty.value };
            } else {
                delete selectedMap[id];
            }
        }

        // 창고 선택
        if(e.target.classList.contains('warehouse') && selectedMap[id]){
            selectedMap[id].warehouse = e.target.value;
        }

        // 수량 입력
        if(e.target.classList.contains('qty') && selectedMap[id]){
            selectedMap[id].qty = e.target.value;
        }

    });

    function submitSelected() {
        const data = Object.entries(selectedMap).map(([product_id, info]) => ({
            product_id,
            warehouse: info.warehouse_id,
            qty: info.qty
        }));

        fetch('/office_staff/inbound_req', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
            .then(res => res.json())
            .then(result => {
                alert('요청 완료');
                console.log(result);
            })
            .catch(err => console.error(err));
    }
</script>
</body>
</html>
