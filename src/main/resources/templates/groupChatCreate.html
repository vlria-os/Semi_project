<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>단체 채팅 만들기</title>
    <style>
        .user-list {
            border: 1px solid #ccc;
            padding: 10px;
            max-height: 300px;
            overflow-y: auto;
        }
        .user-item {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
<h2>단체 채팅방 만들기</h2>
<form th:action="@{/chat/group/create}" method="post">
    <!-- 방 이름 -->
    <div>
        <label>채팅방 이름</label><br>
        <input type="text" name="roomName" required>
    </div>
    <hr>
    <!-- 유저 선택 -->
    <div class="user-list">
        <div th:each="user:${users}" class="user-item">
            <label>
                <input type="checkbox" name="userIds" th:value="${user.webuser_id}">
                <span th:text="${user.webuser_name}">유저명</span>
            </label>
        </div>
    </div>
    <br>
    <button type="submit">채팅방 생성</button>
</form>

</body>
</html>
