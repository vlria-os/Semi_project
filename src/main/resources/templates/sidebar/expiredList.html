<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" th:href="@{/css/sidebar/expiredlist.css}">
</head>
<body>
<div class="container">

    <!--Expired_Sidebar-->
    <div class="main">
        <div class="main-title">
            <span class="main-icon">[ICON]</span>
            폐기 내역
        </div>
        <!--이동 버튼-->
        <div class="view-toggle">
            <button class="view-btn" data-view=""><a th:href="@{/sidebar/dueDate}">유통기한 임박</a></button>
            <button class="view-btn active"><a th:href="@{/sidebar/expiredList}">폐기 내역</a></button>
        </div>

        <!-- 검색 + 필터 -->
        <div class="filter-container">
            <form class="filter">
                <input type="text" id="keyword" name="keyword" th:value="${searchDto.keyword}" placeholder="상품 또는 창고 이름 검색">
                <div class="btn-group">
                    <button type="button" class="filter-btn" value="all" th:classappend="${typeFilter == 'all'} ? 'active' : ''">전체</button>
                    <button type="button" class="filter-btn" value="COLD" th:classappend="${typeFilter == 'COLD'} ? 'active' : ''">냉장</button>
                    <button type="button" class="filter-btn" value="FROZEN" th:classappend="${typeFilter == 'FROZEN'} ? 'active' : ''">냉동</button>
                    <button type="button" class="filter-btn" value="ROOM" th:classappend="${typeFilter == 'ROOM'} ? 'active' : ''">상온</button>
                </div>

                <select name="warehouseFilter" id="warehouseFilter">
                    <option value="">창고 선택</option>
                    <option th:each="w : ${warehouseList}" th:value="${w.warehouse_id}" th:text="${w.warehouse_name}" th:selected="${warehouseFilter == w.warehouse_id.toString()}"></option>
                </select>
            </form>
        </div>

        <!--폐기 목록-->
        <div id="expiredListContainer">
            <table class="expiredListTable">
                <tr>
                    <th>상품명</th><th>보관상태</th><th>창고</th><th>재고수량</th><th>만료일</th><th>경과일</th>
                </tr>
                <tr th:each=" list : ${list}">
                    <td th:text="${list.product_name}"></td>
                    <td th:text="${list.product_type}"></td>
                    <td th:text="${list.warehouse_name}"></td>
                    <td th:text="${list.quantity}"></td>
                    <td th:text="${#dates.format(list.expiration_date, 'yy년-MM월-dd일')}"></td>
                    <td class="expired-text" th:text="${list.days_left} + '일 경과'"></td>
                </tr>
            </table>

            <!-- 페이징 처리-->
            <div class="pagination_wrap">
                <ul>
                    <li th:if="${pageInfo.startPageNum > 1}">
                        <a th:href="@{/sidebar/expiredList(pageNum=${pageInfo.startPageNum -1}, field=${searchDto.field}, keyword=${searchDto.keyword})}">[이전]</a>
                    </li>

                    <li th:each="num : ${#numbers.sequence(pageInfo.startPageNum, pageInfo.endPageNum)}">
                        <a class="page-link" th:data-page="${num}" th:href="@{/sidebar/expiredList(pageNum=${num}, field=${searchDto.field}, keyword=${searchDto.keyword})}">
                            [[ ${num} ]]
                        </a>
                    </li>

                    <li th:if="${pageInfo.endPageNum < pageInfo.totalPageCount}">
                        <a th:href="@{/sidebar/expiredList(pageNum=${pageInfo.endPageNum +1}, field=${searchDto.field}, keyword=${searchDto.keyword})}">[다음]</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
</body>

<script>
    document.addEventListener("DOMContentLoaded", function(){
        const searchBar=document.getElementById("keyword");
        const typeButtons=document.querySelectorAll(".filter-btn");
        const warehouseSelect=document.getElementById("warehouseFilter");
        const container=document.getElementById("expiredListContainer");

        let debounceTimer;

        async function updateTable(pageNum =1){
            const keyword=searchBar.value;
            const warehouseFilter=warehouseSelect.value;
            const typeFilter=document.querySelector(".filter-btn.active").value;

            container.style.opacity="0.5";

            const url=`/sidebar/expiredList?pageNum=${pageNum}&typeFilter=${typeFilter}&warehouseFilter=${warehouseFilter}&keyword=${encodeURIComponent(keyword)}&isAjax=true`;
            try{
                const response=await fetch(url);
                if(!response.ok) throw new Error("Fetch Error");

                const html=await response.text();

                const parser=new DOMParser();
                const doc=parser.parseFromString(html, "text/html");
                const newList=doc.getElementById("expiredListContainer");
                if(newList){
                    container.innerHTML=newList.innerHTML;
                    container.style.opacity="1";
                    paginationFunc();
                }
            }catch(error){
                console.error("Ajax error:", error);
                container.style.opacity="1";
            }
        }
        searchBar.addEventListener("input", ()=>{
            clearTimeout(debounceTimer);
            debounceTimer=setTimeout(()=>updateTable(1), 300);
        });
        typeButtons.forEach(btn=>{
            btn.addEventListener("click", ()=>{
                typeButtons.forEach(b=>b.classList.remove("active"));
                btn.classList.add("active");
                updateTable(1);
            });
        });

        warehouseSelect.addEventListener("change", ()=> updateTable(1));

        function paginationFunc(){
            document.querySelectorAll(".page-link").forEach(link=>{
                link.addEventListener("click", (e)=>{
                    e.preventDefault();
                    updateTable(link.dataset.page);
                });
            });
        }
        paginationFunc();
    })
</script>
</html>
